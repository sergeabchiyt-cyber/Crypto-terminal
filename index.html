<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DOM LADDER · MULTI-VENUE BTCUSDT</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
 --bg0:#0b0e14;--bg1:#12161f;--bg2:#1a1f2c;--line:#242c3d;
 --txt:#dfe3ec;--dim:#78829a;--green:#17d2ad;--red:#f6465d;
 --amber:#f0b90b;--purple:#8b7cf6;
 --green-bar-o:rgba(23,210,173,.16);--green-bar-t:rgba(23,210,173,.42);
 --red-bar-o:rgba(246,70,93,.16);--red-bar-t:rgba(246,70,93,.42);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'JetBrains Mono',monospace;color:var(--txt);background:var(--bg0);display:flex;flex-direction:column;height:100vh}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a3347;border-radius:2px}
.disp{font-family:'Chakra Petch',sans-serif}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

#hdr{flex-shrink:0;display:flex;align-items:center;gap:7px;padding:6px 9px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--bg1),var(--bg0));flex-wrap:wrap}
#hdr .tag{font-weight:700;font-size:11px;letter-spacing:.08em;white-space:nowrap}
#sym-lbl{font-weight:700;font-size:12px;color:var(--amber);white-space:nowrap}
#px{font-weight:700;font-size:14px;transition:color .15s;white-space:nowrap}
#px.up{color:var(--green)}#px.dn{color:var(--red)}
#chg{font-size:9px;font-weight:700;padding:3px 5px;border-radius:3px;white-space:nowrap}
#chg.up{color:var(--green);background:rgba(23,210,173,.12)}
#chg.dn{color:var(--red);background:rgba(246,70,93,.12)}
#feed-info{font-size:8px;color:var(--dim);white-space:nowrap}
#status-wrap{display:flex;align-items:center;gap:4px;flex-shrink:0}
.d{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.d.ok{background:var(--green);box-shadow:0 0 5px var(--green)}
.d.warn{background:var(--amber);box-shadow:0 0 5px var(--amber);animation:pulse 1s infinite}
.d.bad{background:var(--red);box-shadow:0 0 5px var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
#status-txt{font-size:7.5px;color:var(--dim);white-space:nowrap}

#main{flex:1;display:flex;min-height:0}

.sec-h{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;font-size:8px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);background:var(--bg1);border-bottom:1px solid var(--line);flex-shrink:0;gap:6px}
.live-dot{width:4px;height:4px;border-radius:50%;background:var(--green);display:inline-block;margin-right:4px;animation:pulse 1.4s infinite}

#ladder-panel{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--bg0);width:240px;flex:0 0 240px}
@media (max-width:600px){#ladder-panel{width:160px;flex:0 0 160px}}

.lad-head-grid{display:grid;grid-template-columns:3fr 2fr;background:var(--bg1);border-bottom:1px solid var(--line);font-size:7px;font-weight:700;color:var(--dim);letter-spacing:.07em;text-transform:uppercase;text-align:center;padding:3px 0;flex-shrink:0}

#lad-view{flex:1;overflow:hidden;position:relative}
#lad-inner{position:absolute;top:50%;left:0;right:0;transform:translateY(-50%)}

.lad-row{display:grid;grid-template-columns:3fr 2fr;height:18px;line-height:18px;font-size:9px;position:relative;align-items:center}
.lad-size{text-align:right;padding-right:8px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--txt)}
.lad-price{position:relative;text-align:center;font-weight:600;user-select:none}
.lad-row.ask{background:rgba(246,70,93,.16)}
.lad-row.ask.major{background:rgba(246,70,93,.34)}
.lad-row.ask .lad-price{color:var(--red)}
.lad-row.ask.major .lad-price{font-weight:800;font-size:10px}
.lad-row.bid{background:rgba(23,210,173,.16)}
.lad-row.bid.major{background:rgba(23,210,173,.34)}
.lad-row.bid .lad-price{color:var(--green)}
.lad-row.bid.major .lad-price{font-weight:800;font-size:10px}
.lad-row.spread{background:var(--bg1)}
.lad-row.spread .lad-price{grid-column:1/-1;text-align:center;color:var(--dim);font-size:8px;font-weight:600;letter-spacing:.06em}
.lad-row.last .lad-price{outline:2px solid var(--purple);border-radius:2px}
.lad-row.wall-b .lad-size,.lad-row.wall-a .lad-size{text-shadow:0 0 6px #fff;font-weight:800}
.lad-row.best-bid .lad-price::after,.lad-row.best-ask .lad-price::after{content:'';position:absolute;top:50%;width:6px;height:6px;border-radius:50%;transform:translateY(-50%);opacity:var(--chase-a,0);transition:opacity .2s}
.lad-row.best-bid .lad-price::after{left:2px;background:var(--green);box-shadow:0 0 5px var(--green)}
.lad-row.best-ask .lad-price::after{right:2px;background:var(--red);box-shadow:0 0 5px var(--red)}

#lad-foot{display:flex;align-items:center;gap:7px;padding:5px 8px;font-size:8px;color:var(--dim);border-top:1px solid var(--line);background:var(--bg1);flex-shrink:0;flex-wrap:wrap}
#lad-foot .liq-b{color:var(--green)}#lad-foot .liq-a{color:var(--red)}
#tick-in{width:56px;background:var(--bg0);border:1px solid var(--line);color:var(--txt);font:600 9px 'JetBrains Mono',monospace;padding:3px 5px;border-radius:3px;outline:none}
#tick-in:focus{border-color:var(--green)}

#tape-panel{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--bg0);flex:1 1 auto}
#tape-list{flex:1;overflow-y:auto}
.tp-row{display:grid;grid-template-columns:1fr 1fr 1fr;padding:1px 8px 1px 6px;line-height:15px;border-left:2px solid transparent}
.tp-row span{font-size:9px}
.tp-row.b{color:var(--green)}.tp-row.s{color:var(--red)}
.tp-row .q{color:var(--dim);text-align:right}
.tp-row .t{color:var(--dim);text-align:right;font-size:8px}
.ex-BINANCE{border-color:#f0b90b}.ex-BINANCEFUT{border-color:#f3d06d}.ex-BYBIT{border-color:#ff6b35}.ex-BYBITLIN{border-color:#ff9a6c}
.ex-OKX{border-color:#60a5fa}.ex-OKXFUT{border-color:#93c5fd}.ex-GATE{border-color:#34d399}.ex-BITGET{border-color:#fb923c}
.ex-BITSTAMP{border-color:#84cc16}.ex-GEMINI{border-color:#e879f9}.ex-KRAKEN{border-color:#7c3aed}.ex-COINBASE{border-color:#0ea5e9}
.ex-BITFINEX{border-color:#f97316}.ex-HTX{border-color:#10b981}.ex-POLONIEX{border-color:#fcd34d}.ex-BINGX{border-color:#38bdf8}
.ex-WOOX{border-color:#ec4899}.ex-DERIBIT{border-color:#c084fc}
</style>
</head>
<body>

<div id="hdr">
 <span class="disp tag">DOM·LADDER</span>
 <span id="sym-lbl" class="disp">BTCUSDT</span>
 <span id="px" class="disp">--</span>
 <span id="chg">--</span>
 <span style="flex:1"></span>
 <span id="feed-info">0/18 feeds</span>
 <div id="status-wrap"><span class="d bad" id="status-dot"></span><span id="status-txt">offline</span></div>
</div>

<div id="main">
 <div id="ladder-panel">
  <div class="sec-h"><span><span class="live-dot"></span>Depth · Trade Flow</span><span>18-venue combined</span></div>
  <div class="lad-head-grid"><span>Size</span><span>Price</span></div>
  <div id="lad-view"><div id="lad-inner"></div></div>
  <div id="lad-foot">
   <span class="liq-b" id="liq-b">ΣB --</span>
   <span style="display:flex;align-items:center;gap:4px"><span style="color:var(--dim)">TICK</span><input id="tick-in" placeholder="0.5" inputmode="decimal"/></span>
   <span>SPR <span id="spr">--</span></span>
   <span class="liq-a" id="liq-a">ΣA --</span>
  </div>
 </div>

 <div id="tape-panel">
  <div class="sec-h"><span><span class="live-dot"></span>Tape</span><span id="tape-n">0</span></div>
  <div id="tape-list"></div>
 </div>
</div>

<script>
'use strict';

const BINANCE_WS='wss://stream.binance.com:9443';
const BINANCE_REST='https://api.binance.com';
const HALF_RUNGS=24, NUM_RUNGS=HALF_RUNGS*2+1;
const SNAP_LIMIT=3000;
const TICK_DEFAULT=0.5;
const symbol='BTCUSDT';
let tickStep=null;

const SYM_BTC={
 BINANCEFUT:'btcusdt',BYBIT:'BTCUSDT',BYBITLIN:'BTCUSDT',OKX:'BTC-USDT',OKXFUT:'BTC-USDT-SWAP',
 GATE:'BTC_USDT',BITGET:'BTCUSDT',BITSTAMP:'btcusdt',GEMINI:'BTCUSD',KRAKEN:'BTC/USDT',COINBASE:'BTC-USDT',
 BITFINEX:'tBTCUSD',HTX:'btcusdt',POLONIEX:'BTC_USDT',BINGX:'BTC-USDT',WOOX:'SPOT_BTC_USDT',DERIBIT:'BTC_USDT'
};
const VENUE_LIST=['BINANCE'].concat(Object.keys(SYM_BTC));

const els={};
['px','chg','status-dot','status-txt','feed-info','lad-inner','liq-b','liq-a','spr','tick-in','tape-list','tape-n'].forEach(id=>els[id]=document.getElementById(id));

let lastPrice=0, dayPct=0;
let dirty=false;

const book={bids:new Map(),asks:new Map(),lastId:0,ready:false,buf:[]};
let bestBid=0, bestAsk=Infinity;

const chase={bid:{last:0,streak:0,alpha:0},ask:{last:0,streak:0,alpha:0}};

let depthConn=null, dataConn=null;
let ladPool=[];

function fmtQty(n){
 if(n>=1e6)return(n/1e6).toFixed(2)+'M';
 if(n>=1e3)return(n/1e3).toFixed(2)+'K';
 if(n>=10)return n.toFixed(1);
 if(n>=1)return n.toFixed(3);
 if(n>0)return n.toFixed(5);
 return '';
}
function tickDecimals(step){
 const s=step.toString();
 const i=s.indexOf('.');
 return i<0?0:s.length-i-1;
}
function currentTick(){return tickStep||TICK_DEFAULT;}
function bucketize(price,step,isBid){
 return isBid?Math.floor(price/step+1e-9)*step:Math.ceil(price/step-1e-9)*step;
}
function setStatus(state){
 els['status-dot'].className='d '+state;
 els['status-txt'].textContent=state==='ok'?'live':state==='warn'?'connecting':'offline';
}

/* ---------- multi-venue combined book ---------- */
const venueBooks={};
function vBook(v){if(!venueBooks[v])venueBooks[v]=new Map();return venueBooks[v];}
function setVenueLevels(v,levels){const m=vBook(v);m.clear();
 for(const l of levels){const p=+l[0],q=+l[1];if(p>0&&q>0)m.set(p,q);}dirty=true;}
function applyVenueDelta(v,deltas){const m=vBook(v);
 for(const l of deltas){const p=+l[0],q=+l[1];if(!(p>0))continue;q<=0?m.delete(p):m.set(p,q);}dirty=true;}
const pq=l=>[l.price??l[0],l.qty??l.quantity??l.size??l.amount??l[1]];

const sockets={},pings={},streamFactories={},retryDelay={},failCount={};
const exStatus={};
VENUE_LIST.forEach(v=>exStatus[v]='disconnected');
function setEx(id,s){exStatus[id]=s;updateFeedCount();}
function updateFeedCount(){
 const n=Object.values(exStatus).filter(s=>s==='connected').length;
 els['feed-info'].textContent=n+'/'+VENUE_LIST.length+' feeds';
}

async function gunzip(ab){
 const ds=new DecompressionStream('gzip');const w=ds.writable.getWriter();w.write(new Uint8Array(ab));w.close();
 const ch=[];const r=ds.readable.getReader();
 while(true){const res=await r.read();if(res.done)break;ch.push(res.value);}
 const t=ch.reduce((a,c)=>a+c.length,0);const o=new Uint8Array(t);let off=0;ch.forEach(c=>{o.set(c,off);off+=c.length});
 return new TextDecoder().decode(o);
}

function makeVenueWS(id,url,opts){
 opts=opts||{};
 return new Promise((res,rej)=>{
  let ws;try{ws=new WebSocket(url)}catch(e){return rej(e)}
  ws.binaryType='arraybuffer';sockets[id]=ws;let settled=false;
  ws.onopen=()=>{settled=true;failCount[id]=0;retryDelay[id]=1500;setEx(id,'connected');
   if(opts.onopen)opts.onopen(ws);
   if(opts.onping&&opts.pingMs)pings[id]=setInterval(()=>{if(ws.readyState===1)opts.onping(ws)},opts.pingMs);
   res(ws);};
  ws.onmessage=ev=>{try{opts.onmessage(ev,ws)}catch(e){}};
  ws.onerror=()=>{};
  ws.onclose=()=>{if(ws._dead)return;clearInterval(pings[id]);setEx(id,'disconnected');
   if(!settled)return rej(new Error('closed'));scheduleVenueReconnect(id);};
 });
}
function scheduleVenueReconnect(id){
 const f=streamFactories[id];if(!f)return;
 const next=Math.min(retryDelay[id]||1500,30000);retryDelay[id]=next*1.6;
 setTimeout(()=>openVenueStream(id,f,next),next);
}
function openVenueStream(id,factory,retry){
 streamFactories[id]=factory;retryDelay[id]=retry||1500;
 setEx(id,'connecting');
 factory().then(()=>{failCount[id]=0;retryDelay[id]=1500;})
  .catch(()=>{failCount[id]=(failCount[id]||0)+1;scheduleVenueReconnect(id);});
}
function launchAllVenues(){
 Object.keys(A).forEach(id=>setTimeout(()=>openVenueStream(id,A[id]),Math.random()*1500));
}

const A={
BINANCEFUT:()=>{const s=SYM_BTC.BINANCEFUT;return makeVenueWS('BINANCEFUT','wss://fstream.binance.com/stream?streams='+s+'@aggTrade/'+s+'@depth20@500ms',{onmessage(ev){const e=JSON.parse(ev.data);
 if(e.stream&&e.stream.indexOf('@aggTrade')>=0){const d=e.data;ingestTrade('BINANCEFUT',+d.p,+d.q,!d.m,d.T);}
 else if(e.stream&&e.stream.indexOf('@depth')>=0){const d=e.data;setVenueLevels('BINANCEFUT',[].concat(d.bids||[],d.asks||[]));}}});},
BYBIT:()=>{const s=SYM_BTC.BYBIT;return makeVenueWS('BYBIT','wss://stream.bybit.com/v5/public/spot',{onopen(ws){ws.send(JSON.stringify({op:'subscribe',args:['publicTrade.'+s,'orderbook.200.'+s]}))},
 onmessage(ev){const d=JSON.parse(ev.data);
  if(d.topic&&d.topic.indexOf('publicTrade')===0)(d.data||[]).forEach(t=>ingestTrade('BYBIT',+t.p,+t.v,t.S==='Buy',t.T));
  else if(d.topic&&d.topic.indexOf('orderbook')===0){const b=d.data||{};
   d.type==='snapshot'?setVenueLevels('BYBIT',[].concat(b.b||[],b.a||[])):applyVenueDelta('BYBIT',[].concat(b.b||[],b.a||[]));}},
 onping(ws){ws.send(JSON.stringify({op:'ping'}))},pingMs:20000});},
BYBITLIN:()=>{const s=SYM_BTC.BYBITLIN;return makeVenueWS('BYBITLIN','wss://stream.bybit.com/v5/public/linear',{onopen(ws){ws.send(JSON.stringify({op:'subscribe',args:['publicTrade.'+s,'orderbook.500.'+s]}))},
 onmessage(ev){const d=JSON.parse(ev.data);
  if(d.topic&&d.topic.indexOf('publicTrade')===0)(d.data||[]).forEach(t=>ingestTrade('BYBITLIN',+t.p,+t.v,t.S==='Buy',t.T));
  else if(d.topic&&d.topic.indexOf('orderbook')===0){const b=d.data||{};
   d.type==='snapshot'?setVenueLevels('BYBITLIN',[].concat(b.b||[],b.a||[])):applyVenueDelta('BYBITLIN',[].concat(b.b||[],b.a||[]));}},
 onping(ws){ws.send(JSON.stringify({op:'ping'}))},pingMs:20000});},
OKX:()=>{const s=SYM_BTC.OKX;return makeVenueWS('OKX','wss://ws.okx.com:8443/ws/v5/public',{onopen(ws){ws.send(JSON.stringify({op:'subscribe',args:[{channel:'trades',instId:s},{channel:'books',instId:s}]}))},
 onmessage(ev){const d=JSON.parse(ev.data);
  if(d.arg&&d.arg.channel==='trades')(d.data||[]).forEach(t=>ingestTrade('OKX',+t.px,+t.sz,t.side==='buy',+t.ts));
  else if(d.arg&&d.arg.channel==='books'){const b=(d.data||[])[0]||{};
   d.action==='snapshot'?setVenueLevels('OKX',[].concat(b.bids||[],b.asks||[])):applyVenueDelta('OKX',[].concat(b.bids||[],b.asks||[]));}},
 onping(ws){ws.send('ping')},pingMs:25000});},
OKXFUT:()=>{const s=SYM_BTC.OKXFUT;return makeVenueWS('OKXFUT','wss://ws.okx.com:8443/ws/v5/public',{onopen(ws){ws.send(JSON.stringify({op:'subscribe',args:[{channel:'trades',instId:s},{channel:'books',instId:s}]}))},
 onmessage(ev){const d=JSON.parse(ev.data);
  if(d.arg&&d.arg.channel==='trades')(d.data||[]).forEach(t=>ingestTrade('OKXFUT',+t.px,+t.sz,t.side==='buy',+t.ts));
  else if(d.arg&&d.arg.channel==='books'){const b=(d.data||[])[0]||{};
   d.action==='snapshot'?setVenueLevels('OKXFUT',[].concat(b.bids||[],b.asks||[])):applyVenueDelta('OKXFUT',[].concat(b.bids||[],b.asks||[]));}},
 onping(ws){ws.send('ping')},pingMs:25000});},
GATE:()=>{const s=SYM_BTC.GATE;return makeVenueWS('GATE','wss://api.gateio.ws/ws/v4/',{onopen(ws){
  ws.send(JSON.stringify({time:Math.floor(Date.now()/1000),channel:'spot.trades',event:'subscribe',payload:[s]}));
  ws.send(JSON.stringify({time:Math.floor(Date.now()/1000),channel:'spot.order_book',event:'subscribe',payload:[s,50,'100ms']}));},
 onmessage(ev){const d=JSON.parse(ev.data);
  if(d.channel==='spot.trades'&&d.event==='update'){const t=d.result;ingestTrade('GATE',+t.price,+t.amount,t.side==='buy',t.create_time_ms||Date.now());}
  else if(d.channel==='spot.order_book'&&d.event==='update'){const r=d.result||{};setVenueLevels('GATE',[].concat(r.bids||[],r.asks||[]));}},
 onping(ws){ws.send(JSON.stringify({time:Math.floor(Date.now()/1000),channel:'spot.ping',event:'',payload:null}))},pingMs:20000});},
BITGET:()=>{const s=SYM_BTC.BITGET;return makeVenueWS('BITGET','wss://ws.bitget.com/v2/ws/public',{onopen(ws){ws.send(JSON.stringify({op:'subscribe',args:[{instType:'SPOT',channel:'trade',instId:s},{instType:'SPOT',channel:'books15',instId:s}]}))},
 onmessage(ev){const d=JSON.parse(ev.data);
  if(d.arg&&d.arg.channel==='trade'&&(d.action==='snapshot'||d.action==='update'))(d.data||[]).forEach(t=>ingestTrade('BITGET',+t[1],+t[2],t[3]==='buy',+t[0]));
  else if(d.arg&&d.arg.channel==='books15'){const b=(d.data||[])[0]||{};setVenueLevels('BITGET',[].concat(b.bids||[],b.asks||[]));}},
 onping(ws){ws.send('ping')},pingMs:25000});},
BITSTAMP:()=>{const s=SYM_BTC.BITSTAMP;return makeVenueWS('BITSTAMP','wss://ws.bitstamp.net',{onopen(ws){
  ws.send(JSON.stringify({event:'bts:subscribe',data:{channel:'live_trades_'+s}}));
  ws.send(JSON.stringify({event:'bts:subscribe',data:{channel:'order_book_'+s}}));},
 onmessage(ev){const d=JSON.parse(ev.data);
  if(d.event==='trade'){const t=d.data;ingestTrade('BITSTAMP',+t.price,+t.amount,t.type===0,+t.microtimestamp/1000);}
  else if(d.event==='data'&&d.channel&&d.channel.indexOf('order_book')===0){const b=d.data||{};setVenueLevels('BITSTAMP',[].concat(b.bids||[],b.asks||[]));}}});},
GEMINI:()=>{const s=SYM_BTC.GEMINI;return makeVenueWS('GEMINI','wss://api.gemini.com/v2/marketdata?symbols='+s,{onopen(ws){ws.send(JSON.stringify({type:'subscribe',subscriptions:[{name:'l2_updates',symbols:[s]}]}))},
 onmessage(ev){const d=JSON.parse(ev.data);
  if(d.type==='l2_updates'&&d.symbol===s){
   (d.trades||[]).forEach(t=>ingestTrade('GEMINI',+t.price,+t.amount,t.maker_side==='ask',d.timestampms||Date.now()));
   (d.changes||[]).forEach(c=>applyVenueDelta('GEMINI',[[+c[1],+c[2]]]));
  }}});},
KRAKEN:()=>{const s=SYM_BTC.KRAKEN;return makeVenueWS('KRAKEN','wss://ws.kraken.com/v2',{onopen(ws){
  ws.send(JSON.stringify({method:'subscribe',params:{channel:'trade',symbol:[s]},req_id:1}));
  ws.send(JSON.stringify({method:'subscribe',params:{channel:'book',symbol:[s]},req_id:2}));},
 onmessage(ev){const d=JSON.parse(ev.data);
  if(d.channel==='trade'&&d.type==='update')(d.data||[]).forEach(t=>ingestTrade('KRAKEN',+t.price,+t.qty,t.side==='buy',new Date(t.timestamp).getTime()));
  else if(d.channel==='book'){
   if(d.type==='snapshot'){const b=(d.data||[])[0]||{};setVenueLevels('KRAKEN',[].concat(b.bids||[],b.asks||[]).map(pq));}
   else if(d.type==='update'){(d.data||[]).forEach(u=>{const lv=[];
     if(u.bids)u.bids.forEach(p=>lv.push([+p.price,+p.qty]));
     if(u.asks)u.asks.forEach(p=>lv.push([+p.price,+p.qty]));
     if(lv.length)applyVenueDelta('KRAKEN',lv);});}}},
 onping(ws){ws.send(JSON.stringify({method:'ping'}))},pingMs:30000});},
COINBASE:()=>{const s=SYM_BTC.COINBASE;const cbLv={bid:[],ask:[]};
 function cbFlush(){const m=vBook('COINBASE');m.clear();
  ['bid','ask'].forEach(side=>cbLv[side].forEach(l=>{if(l&&l[1]>0)m.set(l[0],l[1]);}));dirty=true;}
 return makeVenueWS('COINBASE','wss://advanced-trade-ws.coinbase.com',{onopen(ws){

/* ---------- ladder pool ---------- */
function initLadder(){
 els['lad-inner'].innerHTML='';
 ladPool=[];
 const frag=document.createDocumentFragment();
 for(let i=0;i<NUM_RUNGS;i++){
  const row=document.createElement('div');
  row.className='lad-row';
  row.innerHTML=
   '<div class="lad-size"></div>'+
   '<div class="lad-price"></div>';
  frag.appendChild(row);
  ladPool.push({
   row,
   sizeVal:row.children[0],
   priceEl:row.children[1],
  });
 }
 els['lad-inner'].appendChild(frag);
}
function clearLadderRows(){
 for(const node of ladPool){
  node.row.className='lad-row';
  node.priceEl.textContent='';
  node.sizeVal.textContent='';
 }
}

function updateChase(side,best){
 const c=chase[side];
 if(!best||best===Infinity||!isFinite(best)){c.streak=0;c.alpha=0;c.last=0;return}
 if(c.last){
  const dir=side==='bid'?(best>c.last):(best<c.last);
  const same=best===c.last;
  if(dir){c.streak++;c.alpha=1-1/(1+c.streak);}
  else if(same){c.alpha*=0.88;if(c.alpha<0.04){c.alpha=0;c.streak=0;}}
  else{c.streak=0;c.alpha*=0.4;if(c.alpha<0.04)c.alpha=0;}
 }
 c.last=best;
}

function renderLadder(){
 const step=currentTick();
 const dec=tickDecimals(step);

 let bb=0,ba=Infinity;
 for(const p of book.bids.keys())if(p>bb)bb=p;
 for(const p of book.asks.keys())if(p<ba)ba=p;

 updateChase('bid',bb);
 updateChase('ask',ba);
 bestBid=bb;bestAsk=ba;

 if(!bb&&ba===Infinity)return;

 const mid=(bb&&ba<Infinity)?(bb+ba)/2:(lastPrice||bb||ba);
 const refBid=bb||(ba-step);
 const refAsk=(ba<Infinity)?ba:(bb+step);
 const gridBid=bucketize(refBid,step,true);
 const gridAsk=bucketize(refAsk,step,false);

 const bidQ=new Float64Array(HALF_RUNGS+1);
 const askQ=new Float64Array(HALF_RUNGS+1);
 function addBid(p,q){const bkt=bucketize(p,step,true);const idx=Math.round((gridBid-bkt)/step)+1;if(idx>=1&&idx<=HALF_RUNGS)bidQ[idx]+=q;}
 function addAsk(p,q){const bkt=bucketize(p,step,false);const idx=Math.round((bkt-gridAsk)/step)+1;if(idx>=1&&idx<=HALF_RUNGS)askQ[idx]+=q;}

 for(const[p,q]of book.bids)addBid(p,q);
 for(const[p,q]of book.asks)addAsk(p,q);
 for(const v in venueBooks){
  const m=venueBooks[v];
  for(const[p,q]of m){
   if(p<=mid)addBid(p,q);else addAsk(p,q);
  }
 }

 let maxOrder=1e-9,sumBid=0,sumAsk=0;
 for(let i=1;i<=HALF_RUNGS;i++){
  sumBid+=bidQ[i];sumAsk+=askQ[i];
  if(bidQ[i]>maxOrder)maxOrder=bidQ[i];
  if(askQ[i]>maxOrder)maxOrder=askQ[i];
 }

 const rows=new Array(NUM_RUNGS);
 for(let i=-HALF_RUNGS;i<=HALF_RUNGS;i++){
  const pos=i+HALF_RUNGS;
  if(i===0){rows[pos]={spread:true};continue}
  let isBid,price,idx;
  if(i<0){isBid=false;idx=-i;price=+(gridAsk+(idx-1)*step).toFixed(dec);}
  else{isBid=true;idx=i;price=+(gridBid-(idx-1)*step).toFixed(dec);}
  const orderQty=isBid?bidQ[idx]:askQ[idx];
  rows[pos]={isBid,price,orderQty,idx,best:idx===1};
 }
 paintLadder(rows,maxOrder,dec,step);
 updateFooter(sumBid,sumAsk,dec);
}

function paintLadder(rows,maxOrder,dec,step){
 const tick=currentTick();
 const majorStep=step*10;
 for(let pos=0;pos<NUM_RUNGS;pos++){
  const node=ladPool[pos];
  const r=rows[pos];
  if(r.spread){
   node.row.className='lad-row spread';
   node.priceEl.textContent=(bestAsk<Infinity&&bestBid>0)?('SPREAD '+(bestAsk-bestBid).toFixed(dec)):'—';
   node.sizeVal.textContent='';
   continue;
  }
  const isMajor=Math.abs(Math.round(r.price/majorStep)*majorStep-r.price)<step*0.01;
  let cls='lad-row '+(r.isBid?'bid':'ask');
  if(isMajor)cls+=' major';
  if(lastPrice&&Math.abs(r.price-lastPrice)<tick/2)cls+=' last';
  if(r.orderQty>maxOrder*0.75)cls+=(r.isBid?' wall-b':' wall-a');
  if(r.best)cls+=r.isBid?' best-bid':' best-ask';
  node.row.className=cls;
  node.row.style.setProperty('--chase-a',(r.isBid?chase.bid.alpha:chase.ask.alpha).toFixed(2));
  node.priceEl.textContent=r.price.toFixed(dec);
  node.sizeVal.textContent=r.orderQty>0?fmtQty(r.orderQty):'';
 }
}
function updateFooter(sumBid,sumAsk,dec){
 els['liq-b'].textContent='ΣB '+fmtQty(sumBid);
 els['liq-a'].textContent='ΣA '+fmtQty(sumAsk);
 els['spr'].textContent=(bestAsk<Infinity&&bestBid>0)?(bestAsk-bestBid).toFixed(dec):'--';
}

let lastRenderTs=0;
const RENDER_INTERVAL_MS=120;
function tickLoop(ts){
 if(ts-lastRenderTs>=RENDER_INTERVAL_MS&&(dirty||tapeDirty)){
  lastRenderTs=ts;
  if(dirty){dirty=false;renderLadder();}
  if(tapeDirty){tapeDirty=false;flushTape();updatePriceDisplay();}
 }
 requestAnimationFrame(tickLoop);
}

let tapeTrades=[], tapeDirty=false;
function flushTape(){
 const recent=tapeTrades.length>60?tapeTrades.slice(-60):tapeTrades;
 const dec=tickDecimals(currentTick());
 let html='';
 for(let i=recent.length-1;i>=0;i--){
  const t=recent[i];
  const d=new Date(t.ts);
  const tstr=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
  html+='<div class="tp-row '+(t.isBuy?'b':'s')+' ex-'+t.exchange+'"><span>'+t.price.toFixed(dec)+'</span><span class="q">'+fmtQty(t.qty)+'</span><span class="t">'+tstr+'</span></div>';
 }
 els['tape-list'].innerHTML=html;
 els['tape-n'].textContent=recent.length;
}

function ingestTrade(exchange,price,qty,isBuy,ts){
 if(!(price>0)||!(qty>0))return;
 lastPrice=price;
 dirty=true;
 tapeDirty=true;
 tapeTrades.push({exchange,price,qty,isBuy,ts});
 if(tapeTrades.length>200)tapeTrades.splice(0,tapeTrades.length-200);
}

/* ---------- binance primary feed (depth authoritative + candles) ---------- */
function makeReconnectingWS(urlFn,opts){
 let sock=null,retryT=null,closed=false;
 function connect(){
  if(closed)return;
  sock=new WebSocket(urlFn());
  sock.onopen=()=>{opts.onOpen&&opts.onOpen()};
  sock.onmessage=ev=>opts.onMessage(ev);
  sock.onclose=()=>{
   if(sock._dead)return;
   opts.onClose&&opts.onClose();
   retryT=setTimeout(connect,3000);
  };
  sock.onerror=()=>{};
 }
 connect();
 return {
  close(){closed=true;if(retryT)clearTimeout(retryT);if(sock){sock._dead=true;try{sock.close()}catch(e){}}}
 };
}

function applyDepth(d){
 for(const[p,q]of d.b){
  const price=+p;
  if(q==='0')book.bids.delete(price);else book.bids.set(price,+q);
 }
 for(const[p,q]of d.a){
  const price=+p;
  if(q==='0')book.asks.delete(price);else book.asks.set(price,+q);
 }
 book.lastId=d.u;
}
function startDepth(){
 book.bids.clear();book.asks.clear();book.buf=[];book.ready=false;book.lastId=0;
 depthConn=makeReconnectingWS(
  ()=>BINANCE_WS+'/ws/'+symbol.toLowerCase()+'@depth@100ms',
  {
   onOpen:()=>{setStatus('warn');setEx('BINANCE','connecting');},
   onClose:()=>{setStatus('bad');setEx('BINANCE','disconnected');},
   onMessage:ev=>{
    const d=JSON.parse(ev.data);
    if(d.e!=='depthUpdate')return;
    if(!book.ready){book.buf.push(d);if(book.buf.length>3000)book.buf.shift();return}
    if(d.U!==book.lastId+1){resyncDepth();return}
    applyDepth(d);
    dirty=true;
   }
  }
 );
 fetchSnapshot();
}
function resyncDepth(){
 console.log('[depth] resync @ '+new Date().toLocaleTimeString());
 if(depthConn)depthConn.close();
 startDepth();
}
function fetchSnapshot(){
 fetch(BINANCE_REST+'/api/v3/depth?symbol='+symbol+'&limit='+SNAP_LIMIT)
  .then(r=>r.json()).then(snap=>{
   if(!snap||!snap.lastUpdateId){setStatus('bad');return}
   book.bids.clear();book.asks.clear();
   book.lastId=snap.lastUpdateId;
   for(const[p,q]of snap.bids)book.bids.set(+p,+q);
   for(const[p,q]of snap.asks)book.asks.set(+p,+q);
   let synced=false;
   for(const d of book.buf){
    if(d.u<book.lastId+1)continue;
    if(!synced&&d.U>book.lastId+1)continue;
    applyDepth(d);synced=true;
   }
   book.buf=[];book.ready=true;
   setStatus('ok');setEx('BINANCE','connected');
   dirty=true;
  }).catch(()=>setStatus('bad'));
}

function startDataSocket(){
 const sym=symbol.toLowerCase();
 const streams=sym+'@trade/'+sym+'@ticker';
 dataConn=makeReconnectingWS(
  ()=>BINANCE_WS+'/stream?streams='+streams,
  {
   onMessage:ev=>{
    const msg=JSON.parse(ev.data);
    const st=msg.stream||'';
    const d=msg.data;
    if(!d)return;
    if(st.indexOf('@trade')>=0){
     ingestTrade('BINANCE',+d.p,+d.q,!d.m,d.T);
    }else if(st.indexOf('@ticker')>=0){
     dayPct=+d.P;
     updatePriceDisplay();
    }
   }
  }
 );
}

function updatePriceDisplay(){
 const dec=tickDecimals(currentTick());
 els['px'].textContent=lastPrice?lastPrice.toFixed(dec):'--';
 els['px'].className='disp '+(dayPct>=0?'up':'dn');
 els['chg'].textContent=dayPct?((dayPct>=0?'+':'')+dayPct.toFixed(2)+'%'):'--';
 els['chg'].className=dayPct>=0?'up':'dn';
}

function wireControls(){
 els['tick-in'].addEventListener('change',()=>{
  const v=parseFloat(els['tick-in'].value);
  tickStep=(v>0)?v:null;
  dirty=true;
 });
}

function boot(){
 initLadder();
 wireControls();
 setStatus('warn');
 startDepth();
 startDataSocket();
 launchAllVenues();
 requestAnimationFrame(tickLoop);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
