<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OMNI · Orderflow Dock</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg0:#0b0e14; --bg1:#12161f; --bg2:#1a1f2c; --line:#242c3d;
    --txt:#dfe3ec; --dim:#78829a; --green:#17d2ad; --red:#f6465d;
    --amber:#f0b90b; --purple:#8b7cf6;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:'JetBrains Mono',monospace; color:var(--txt); overflow:hidden;
    background:
      radial-gradient(900px 320px at 50% -120px, rgba(23,210,173,.06), transparent 60%),
      radial-gradient(700px 300px at 80% 110%, rgba(139,124,246,.05), transparent 60%),
      linear-gradient(180deg,#0d1119,var(--bg0));
  }
  ::-webkit-scrollbar{width:4px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#2a3347;border-radius:2px}

  /* the dock: a slim strip even on a wide window */
  #dock{
    width:100%; max-width:320px; height:100vh; margin:0 auto;
    display:flex; flex-direction:column;
    border-left:1px solid var(--line); border-right:1px solid var(--line);
    background:linear-gradient(180deg, rgba(18,22,31,.92), rgba(13,16,23,.96));
    box-shadow:0 0 60px rgba(0,0,0,.5);
  }

  .disp{font-family:'Chakra Petch',sans-serif}
  .sec{border-bottom:1px solid var(--line)}
  .sec-h{
    display:flex;align-items:center;justify-content:space-between;
    padding:5px 10px; font-size:9px; letter-spacing:.14em; color:var(--dim);
    text-transform:uppercase; user-select:none;
    background:linear-gradient(90deg, rgba(255,255,255,.02), transparent);
  }
  .sec-h .tag{display:flex;align-items:center;gap:5px}
  .live-dot{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  /* header */
  #brandbar{
    display:flex;align-items:center;gap:8px;padding:9px 10px;
    border-bottom:1px solid var(--line);
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0 1px, transparent 1px 3px),
      linear-gradient(90deg, rgba(23,210,173,.06), transparent 55%);
  }
  #brandbar .logo{
    width:26px;height:26px;border-radius:6px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--green),#0e7c8c);
    box-shadow:0 0 14px rgba(23,210,173,.35);
  }
  .status-chip{
    display:flex;align-items:center;gap:5px;font-size:9px;color:var(--dim);
    padding:3px 7px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.02);
    transition:.2s;
  }
  .status-chip .d{width:6px;height:6px;border-radius:50%}
  .d.ok{background:var(--green);box-shadow:0 0 6px var(--green)}
  .d.warn{background:var(--amber);box-shadow:0 0 6px var(--amber);animation:pulse 1s infinite}
  .d.bad{background:var(--red);box-shadow:0 0 6px var(--red)}
  .icon-btn{
    width:26px;height:26px;border-radius:6px;border:1px solid var(--line);
    background:rgba(255,255,255,.02);color:var(--dim);cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:12px;
    transition:.15s;
  }
  .icon-btn:hover{color:var(--txt);border-color:#3a4560;background:rgba(255,255,255,.05);transform:translateY(-1px)}

  /* instrument */
  #price{
    font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:26px;line-height:1;
    letter-spacing:.01em;padding:2px 6px;border-radius:5px;transition:color .2s;
  }
  #price.up{color:var(--green);animation:flashUp .5s ease-out}
  #price.dn{color:var(--red);animation:flashDn .5s ease-out}
  @keyframes flashUp{0%{background:rgba(23,210,173,.25)}100%{background:transparent}}
  @keyframes flashDn{0%{background:rgba(246,70,93,.25)}100%{background:transparent}}
  select,input[type=number]{
    background:var(--bg1);border:1px solid var(--line);color:var(--txt);
    border-radius:5px;font-family:'JetBrains Mono',monospace;outline:none;transition:border .15s;
  }
  select:focus,input:focus{border-color:var(--green)}

  /* DOM */
  .dom-row{position:relative;display:flex;justify-content:space-between;padding:1px 10px;font-size:10.5px;line-height:1.7;transition:background .12s}
  .dom-row:hover{background:rgba(255,255,255,.03)}
  .dom-bar{position:absolute;top:0;bottom:0;right:0;opacity:.14;pointer-events:none;transition:width .18s ease}
  .dom-col{position:relative;z-index:1}
  .ask{color:var(--red)} .bid{color:var(--green)}
  #spreadbar{
    display:flex;align-items:center;justify-content:center;gap:7px;
    margin:3px 8px;padding:3px 0;border-radius:4px;
    background:var(--bg2);font-size:10px;font-weight:700;color:var(--amber);
    border:1px solid transparent;transition:.2s;flex-shrink:0;
  }
  #spreadbar.custom{border-color:var(--amber);box-shadow:0 0 10px rgba(240,185,11,.2)}
  #spread-input{width:52px;text-align:center;font-size:10px;padding:1px 2px;color:var(--amber)}

  /* tape */
  .tape-row{
    display:grid;grid-template-columns:1.1fr .8fr .9fr;align-items:center;
    font-size:10px;line-height:1.65;padding:1px 8px 1px 9px;
    border-left:3px solid transparent;border-bottom:1px solid rgba(36,44,61,.5);
    animation:rowIn .22s ease-out;
  }
  @keyframes rowIn{from{opacity:0;transform:translateX(7px)}to{opacity:1;transform:none}}
  .tape-row .q{text-align:right}.tape-row .t{text-align:right;color:var(--dim);font-size:9px}
  .tb{color:var(--green)} .ts{color:var(--red)}
  .ex-BINANCE{border-color:#f0b90b}.ex-BINANCEFUT{border-color:#f3d06d}.ex-BYBIT{border-color:#ff6b35}.ex-BYBITLIN{border-color:#ff9a6c}
  .ex-OKX{border-color:#60a5fa}.ex-OKXFUT{border-color:#93c5fd}.ex-GATE{border-color:#34d399}.ex-MEXC{border-color:#a78bfa}
  .ex-BITGET{border-color:#fb923c}.ex-KUCOIN{border-color:#22d3ee}.ex-BITSTAMP{border-color:#84cc16}.ex-GEMINI{border-color:#e879f9}
  .ex-KRAKEN{border-color:#7c3aed}.ex-COINBASE{border-color:#0ea5e9}.ex-BITFINEX{border-color:#f97316}.ex-HTX{border-color:#10b981}
  .ex-PHEMEX{border-color:#d946ef}.ex-POLONIEX{border-color:#fcd34d}.ex-BINGX{border-color:#38bdf8}.ex-WOOX{border-color:#ec4899}.ex-DERIBIT{border-color:#c084fc}

  /* stats */
  #stats{display:flex;gap:6px;padding:6px 8px}
  .stat{flex:1;background:var(--bg1);border:1px solid var(--line);border-radius:5px;padding:4px 6px;transition:.15s}
  .stat:hover{border-color:#3a4560}
  .stat .l{font-size:8px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
  .stat .v{font-size:12px;font-weight:700}

  /* AI */
  #ai{display:flex;flex-direction:column;background:rgba(13,15,23,.7);transition:height .25s ease;overflow:hidden;flex-shrink:0}
  #ai-head{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;cursor:pointer;user-select:none;border-top:1px solid var(--line)}
  #ai-head:hover{background:rgba(255,255,255,.02)}
  .ai-badge{display:flex;align-items:center;gap:6px;font-size:9px;font-weight:700;letter-spacing:.12em;color:var(--purple);text-transform:uppercase}
  .nim-dot{width:6px;height:6px;border-radius:50%;background:#76b900;box-shadow:0 0 6px #76b900}
  .nim-dot.busy{animation:pulse .6s infinite}
  #ai-msgs{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px;font-size:10.5px;line-height:1.5;min-height:0}
  .m-u{align-self:flex-end;background:#1c3a5e;color:#bfdbfe;border-radius:8px 8px 2px 8px;padding:5px 8px;max-width:90%;white-space:pre-wrap;word-break:break-word}
  .m-a{align-self:flex-start;background:var(--bg2);color:#cfd4e0;border-radius:8px 8px 8px 2px;padding:5px 8px;max-width:94%;white-space:pre-wrap;word-break:break-word;border-left:2px solid var(--purple)}
  .m-t{align-self:flex-start;background:#10141f;color:var(--dim);border-radius:4px;padding:4px 7px;max-width:94%;white-space:pre-wrap;font-style:italic;font-size:9.5px;border-left:2px solid #374151}
  .m-e{align-self:center;background:#3b0d0d;color:#fca5a5;border-radius:5px;padding:5px 8px;font-size:9.5px;max-width:96%;white-space:pre-wrap}
  .m-s{align-self:center;color:var(--dim);font-size:9px;font-style:italic}
  #ai-inrow{display:flex;gap:4px;padding:6px 8px;border-top:1px solid var(--line)}
  #ai-in{flex:1;background:var(--bg1);border:1px solid var(--line);color:var(--txt);font-size:10.5px;font-family:'JetBrains Mono',monospace;padding:5px 7px;border-radius:5px;outline:none;resize:none;min-height:30px;max-height:70px}
  #ai-in:focus{border-color:var(--purple)}
  #ai-send{background:var(--purple);color:#fff;font-size:9px;font-weight:700;border:none;border-radius:5px;padding:0 11px;cursor:pointer;transition:.15s;flex-shrink:0}
  #ai-send:hover:not(:disabled){background:#7a68f0;transform:translateY(-1px)}
  #ai-send:disabled{opacity:.4;cursor:not-allowed}

  /* modals */
  .modal{position:fixed;inset:0;background:rgba(5,7,12,.85);backdrop-filter:blur(5px);z-index:70;display:flex;align-items:center;justify-content:center}
  .modal.hidden{display:none}
  .modal-box{background:var(--bg1);border:1px solid #333d55;border-radius:10px;padding:22px;width:340px;max-width:92vw;box-shadow:0 25px 70px rgba(0,0,0,.7);animation:pop .2s ease-out}
  @keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}
  .fld{display:block;font-size:8.5px;font-weight:700;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;margin:12px 0 4px}
  .modal input[type=url],.modal input[type=password]{width:100%;background:var(--bg0);border:1px solid var(--line);color:var(--txt);font-size:11px;font-family:'JetBrains Mono',monospace;padding:7px 9px;border-radius:6px;outline:none;transition:border .15s}
  .modal input:focus{border-color:var(--green)}
  .btn{border:none;border-radius:6px;font-size:11px;font-weight:700;padding:8px 12px;cursor:pointer;transition:.15s;font-family:'Chakra Petch',sans-serif}
  .btn:hover{transform:translateY(-1px)}
  .btn-g{background:var(--green);color:#06251d}.btn-g:hover{box-shadow:0 4px 14px rgba(23,210,173,.35)}
  .btn-p{background:var(--purple);color:#fff}.btn-p:hover{box-shadow:0 4px 14px rgba(139,124,246,.35)}
  .btn-d{background:var(--bg2);color:var(--dim)}.btn-d:hover{color:var(--txt)}

  #debug{position:fixed;bottom:0;left:0;right:0;height:160px;background:#080a10;border-top:1px solid #333d55;z-index:80;font-size:9px;overflow-y:auto;padding:6px 10px;color:#9aa3b8;display:none}
  #debug.open{display:block}
</style>
</head>
<body>

<div id="dock">

  <!-- ══ BRAND BAR ══ -->
  <div id="brandbar">
    <div class="logo"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#06251d" stroke-width="2.6" stroke-linecap="round"><path d="M3 17l5-6 4 4 6-8 3 4"/></svg></div>
    <div style="flex:1;min-width:0">
      <div class="disp" style="font-weight:700;font-size:13px;letter-spacing:.14em;line-height:1">OMNI<span style="color:var(--green)">·</span>DOCK</div>
      <div style="font-size:8px;color:var(--dim);letter-spacing:.18em;text-transform:uppercase">orderflow terminal</div>
    </div>
    <div class="status-chip" id="net-chip" title="Backend status"><span class="d warn" id="net-dot"></span><span id="net-txt">…</span></div>
    <button class="icon-btn" onclick="openBackendModal()" title="Backend">⚙</button>
    <button class="icon-btn" onclick="openKeyModal()" title="NIM key">🔑</button>
  </div>

  <!-- ══ INSTRUMENT ══ -->
  <div class="sec" style="padding:8px 10px">
    <div style="display:flex;align-items:center;gap:8px">
      <select id="asset" onchange="switchSymbol(this.value)" style="flex:1;font-size:11px;font-weight:700;color:var(--amber);padding:4px 6px;cursor:pointer">
        <option value="BTCUSDT">BTC / USDT</option>
        <option value="ETHUSDT">ETH / USDT</option>
        <option value="SOLUSDT">SOL / USDT</option>
        <option value="BNBUSDT">BNB / USDT</option>
        <option value="XRPUSDT">XRP / USDT</option>
      </select>
      <div id="price" class="up">--</div>
    </div>
  </div>

  <!-- ══ ORDER BOOK ══ -->
  <div class="sec" style="display:flex;flex-direction:column;flex:1.25;min-height:120px;overflow:hidden">
    <div class="sec-h"><span class="tag"><span class="live-dot"></span>Depth</span><span id="dom-exch" style="color:var(--amber)">BINANCE</span></div>
    <div id="dom-asks" style="flex:1;display:flex;flex-direction:column-reverse;overflow:hidden"></div>
    <div id="spreadbar">
      <span>SPREAD</span><span id="spread-live">$--</span>
      <input id="spread-input" type="number" step="any" min="0" placeholder="auto" title="Override spread — empty = live" oninput="setCustomSpread(this.value)"/>
    </div>
    <div id="dom-bids" style="flex:1;display:flex;flex-direction:column;overflow:hidden"></div>
  </div>

  <!-- ══ TAPE ══ -->
  <div class="sec" style="display:flex;flex-direction:column;flex:1;min-height:90px;overflow:hidden">
    <div class="sec-h"><span class="tag"><span class="live-dot"></span>Time &amp; Sales</span><span id="tape-count" style="color:var(--dim)">0</span></div>
    <div id="tape" style="flex:1;overflow:hidden;display:flex;flex-direction:column-reverse"></div>
  </div>

  <!-- ══ STATS ══ -->
  <div id="stats" class="sec">
    <div class="stat"><div class="l">Streams</div><div class="v" id="st-streams" style="color:var(--green)">0/0</div></div>
    <div class="stat"><div class="l">Trades/s</div><div class="v" id="st-tps" style="color:var(--amber)">0</div></div>
    <div class="stat"><div class="l">Vol</div><div class="v" id="st-vol" style="color:#60a5fa">--</div></div>
  </div>

  <!-- ══ AI ══ -->
  <div id="ai" style="height:230px">
    <div id="ai-head" onclick="toggleAi()">
      <span class="ai-badge"><span class="nim-dot" id="nim-dot"></span>NIM · GLM-5.2</span>
      <span id="ai-chev" style="color:var(--dim);font-size:10px">▼</span>
    </div>
    <div id="ai-msgs"></div>
    <div id="ai-inrow">
      <textarea id="ai-in" rows="1" placeholder="Ask about the tape…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendToGLM()}"></textarea>
      <button id="ai-send" onclick="sendToGLM()">SEND</button>
    </div>
  </div>

</div>

<!-- ══ BACKEND MODAL ══ -->
<div id="backend-modal" class="modal hidden">
  <div class="modal-box">
    <div class="disp" style="font-weight:700;font-size:14px;letter-spacing:.1em">BACKEND <span style="color:var(--green)">LINK</span></div>
    <p style="font-size:10px;color:var(--dim);margin:6px 0 0;line-height:1.5">Rust proxy for NIM (AES-GCM) + KuCoin. Health endpoint <code style="color:var(--green)">/healthz</code>.</p>
    <label class="fld">Backend URL</label>
    <input id="backend-url" type="url" placeholder="https://your-backend.onrender.com"/>
    <div id="backend-status" style="font-size:9.5px;color:var(--dim);margin:8px 2px;min-height:14px">Idle.</div>
    <label style="display:flex;align-items:center;gap:6px;font-size:9.5px;color:var(--dim);cursor:pointer;margin-top:4px">
      <input type="checkbox" id="allow-nobackend" style="accent-color:var(--purple)"/> Run limited mode (no NIM / KuCoin)
    </label>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn btn-d" onclick="testBackend()">Test</button>
      <button class="btn btn-g" style="flex:1" onclick="connectBackend()">Launch Dock</button>
    </div>
  </div>
</div>

<!-- ══ KEY MODAL ══ -->
<div id="key-modal" class="modal hidden">
  <div class="modal-box">
    <div class="disp" style="font-weight:700;font-size:14px;letter-spacing:.1em">NVIDIA <span style="color:#76b900">NIM</span></div>
    <p style="font-size:10px;color:var(--dim);margin:6px 0 0;line-height:1.5">Your <code style="color:var(--green)">nvapi-</code> key, encrypted locally with AES-GCM before it touches the wire.</p>
    <label class="fld">API Key</label>
    <input id="nim-key" type="password" placeholder="nvapi-…"/>
    <p id="key-err" style="font-size:9.5px;margin:8px 2px;min-height:12px"></p>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn btn-d" onclick="closeKeyModal()">Skip</button>
      <button class="btn btn-p" style="flex:1" onclick="saveNimKey()">Encrypt &amp; Save</button>
    </div>
  </div>
</div>

<div id="debug"><div id="debug-log"></div></div>

<script>
// ════════════════════════════════════════════════════════════════
// CONFIG / STATE
// ════════════════════════════════════════════════════════════════
const SHARED_SECRET_HEX="0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef";
const MAX_TAPE=90, MAX_LEVELS=11, TPS_WIN=2000, NIM_MODEL='z-ai/glm-5.2';
let TOTAL_EX=21;

let currentBase='BTCUSDT';
let tape=[],stamps=[],lastPrice=0,vol=0,prevPrice=0;
const sockets={},pings={};
const book={asks:[],bids:[]};
let customSpread=null;

let nimKey=sessionStorage.getItem('nim_key')||'';
let aiHistory=[],aiOpen=true,aiBusy=false;
let BACKEND_URL=loadBackendUrl();
let backendHealthy=false, started=false;

const EXCHANGES=['BINANCE','BINANCEFUT','BYBIT','BYBITLIN','OKX','OKXFUT','GATE','MEXC','BITGET','KUCOIN','BITSTAMP','GEMINI','KRAKEN','COINBASE','BITFINEX','HTX','PHEMEX','POLONIEX','BINGX','WOOX','DERIBIT'];
const exStatus={}; EXCHANGES.forEach(e=>exStatus[e]='disconnected');
const DISABLED_EX=new Set(['KUCOIN','PHEMEX']);
function recalcTotalEx(){TOTAL_EX=EXCHANGES.filter(e=>!DISABLED_EX.has(e)).length;refreshStreams();}

const SYM={
 BTCUSDT:{BINANCE:'btcusdt',BINANCEFUT:'btcusdt',BYBIT:'BTCUSDT',BYBITLIN:'BTCUSDT',OKX:'BTC-USDT',OKXFUT:'BTC-USDT-SWAP',GATE:'BTC_USDT',MEXC:'BTCUSDT',BITGET:'BTCUSDT',KUCOIN:'BTC-USDT',BITSTAMP:'btcusdt',GEMINI:'BTCUSD',KRAKEN:'BTC/USDT',COINBASE:'BTC-USDT',BITFINEX:'tBTCUSD',HTX:'btcusdt',PHEMEX:'BTCUSDT',POLONIEX:'BTC_USDT',BINGX:'BTC-USDT',WOOX:'SPOT_BTC_USDT',DERIBIT:'BTC_USDT'},
 ETHUSDT:{BINANCE:'ethusdt',BINANCEFUT:'ethusdt',BYBIT:'ETHUSDT',BYBITLIN:'ETHUSDT',OKX:'ETH-USDT',OKXFUT:'ETH-USDT-SWAP',GATE:'ETH_USDT',MEXC:'ETHUSDT',BITGET:'ETHUSDT',KUCOIN:'ETH-USDT',BITSTAMP:'ethusdt',GEMINI:'ETHUSD',KRAKEN:'ETH/USDT',COINBASE:'ETH-USDT',BITFINEX:'tETHUSD',HTX:'ethusdt',PHEMEX:'ETHUSDT',POLONIEX:'ETH_USDT',BINGX:'ETH-USDT',WOOX:'SPOT_ETH_USDT',DERIBIT:'ETH_USDT'},
 SOLUSDT:{BINANCE:'solusdt',BINANCEFUT:'solusdt',BYBIT:'SOLUSDT',BYBITLIN:'SOLUSDT',OKX:'SOL-USDT',OKXFUT:'SOL-USDT-SWAP',GATE:'SOL_USDT',MEXC:'SOLUSDT',BITGET:'SOLUSDT',KUCOIN:'SOL-USDT',BITSTAMP:'solusd',GEMINI:'SOLUSD',KRAKEN:'SOL/USDT',COINBASE:'SOL-USDT',BITFINEX:'tSOLUSD',HTX:'solusdt',PHEMEX:'SOLUSDT',POLONIEX:'SOL_USDT',BINGX:'SOL-USDT',WOOX:'SPOT_SOL_USDT',DERIBIT:null},
 BNBUSDT:{BINANCE:'bnbusdt',BINANCEFUT:'bnbusdt',BYBIT:'BNBUSDT',BYBITLIN:'BNBUSDT',OKX:'BNB-USDT',OKXFUT:null,GATE:'BNB_USDT',MEXC:'BNBUSDT',BITGET:'BNBUSDT',KUCOIN:'BNB-USDT',BITSTAMP:null,GEMINI:null,KRAKEN:null,COINBASE:null,BITFINEX:null,HTX:'bnbusdt',PHEMEX:'BNBUSDT',POLONIEX:'BNB_USDT',BINGX:'BNB-USDT',WOOX:'SPOT_BNB_USDT',DERIBIT:null},
 XRPUSDT:{BINANCE:'xrpusdt',BINANCEFUT:'xrpusdt',BYBIT:'XRPUSDT',BYBITLIN:'XRPUSDT',OKX:'XRP-USDT',OKXFUT:'XRP-USDT-SWAP',GATE:'XRP_USDT',MEXC:'XRPUSDT',BITGET:'XRPUSDT',KUCOIN:'XRP-USDT',BITSTAMP:'xrpusdt',GEMINI:'XRPUSD',KRAKEN:'XRP/USDT',COINBASE:'XRP-USDT',BITFINEX:'tXRPUSD',HTX:'xrpusdt',PHEMEX:'XRPUSDT',POLONIEX:'XRP_USDT',BINGX:'XRP-USDT',WOOX:'SPOT_XRP_USDT',DERIBIT:null},
};

// ════════════════════════════════════════════════════════════════
// UTIL

function loadBackendUrl(){try{return localStorage.getItem('backend_url')||''}catch{return''}}
function saveBackendUrl(u){try{u?localStorage.setItem('backend_url',u):localStorage.removeItem('backend_url')}catch{}}
function normalizeBackendUrl(r){let u=(r||'').trim();if(!u)return'';if(!/^https?:\/\//i.test(u))u='https://'+u;try{return new URL(u).origin}catch{return''}}
function wsBase(r){try{const u=new URL(r);return(u.protocol==='https:'?'wss://':'ws://')+u.host}catch{return''}}
function dbg(l,...a){const m=a.map(x=>typeof x==='object'?JSON.stringify(x):String(x)).join(' ');console.log(`[${l}]`,m);
 const el=document.getElementById('debug-log');if(!el)return;const d=document.createElement('div');
 d.innerHTML=`<span style="color:#5b6478">${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</span> <span style="color:#8b7cf6">[${l}]</span> ${m}`;
 el.insertBefore(d,el.firstChild);if(el.children.length>60)el.lastChild.remove();}

async function encryptAES(text,hexKey){
 const enc=new TextEncoder();const kb=new Uint8Array(hexKey.match(/.{1,2}/g).map(b=>parseInt(b,16)));
 const ck=await crypto.subtle.importKey("raw",kb,{name:"AES-GCM"},false,["encrypt"]);
 const iv=crypto.getRandomValues(new Uint8Array(12));
 const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},ck,enc.encode(text));
 return{iv:btoa(String.fromCharCode(...iv)),ciphertext:btoa(String.fromCharCode(...new Uint8Array(ct)))};
}

function setNet(state,txt){const d=document.getElementById('net-dot'),t=document.getElementById('net-txt');
 d.className='d '+(state==='ok'?'ok':state==='bad'?'bad':'warn');t.textContent=txt;}
async function checkBackend(url){try{const c=new AbortController();const t=setTimeout(()=>c.abort(),4000);
 const r=await fetch(`${url}/healthz`,{cache:'no-store',signal:c.signal});clearTimeout(t);
 if(!r.ok)throw new Error(`HTTP ${r.status}`);const j=await r.json();return j?.ok===true;}catch(e){dbg('BACKEND',`health: ${e.message}`);return false;}}
function openBackendModal(){document.getElementById('backend-modal').classList.remove('hidden');document.getElementById('backend-url').value=BACKEND_URL||'';}
function closeBackendModal(){document.getElementById('backend-modal').classList.add('hidden');}
async function testBackend(){const url=normalizeBackendUrl(document.getElementById('backend-url').value);const s=document.getElementById('backend-status');
 if(!url){s.textContent='✗ Enter a valid URL.';s.style.color='var(--red)';return;}
 s.textContent='⏳ Checking…';s.style.color='var(--amber)';
 const ok=await checkBackend(url);s.textContent=ok?`✓ Healthy: ${url}`:`✗ Unreachable: ${url}`;s.style.color=ok?'var(--green)':'var(--red)';}
async function connectBackend(){
 const raw=document.getElementById('backend-url').value;const allow=document.getElementById('allow-nobackend').checked;
 const url=normalizeBackendUrl(raw);const s=document.getElementById('backend-status');
 if(!url){if(allow){BACKEND_URL='';backendHealthy=false;saveBackendUrl('');applyBackend();closeBackendModal();start();return;}
  s.textContent='✗ Enter a URL or enable limited mode.';s.style.color='var(--red)';return;}
 s.textContent='⏳ Checking…';s.style.color='var(--amber)';
 const ok=await checkBackend(url);backendHealthy=ok;BACKEND_URL=url;saveBackendUrl(url);
 if(!ok&&!allow){s.textContent='✗ Unreachable. Enable limited mode or fix backend.';s.style.color='var(--red)';return;}
 applyBackend();closeBackendModal();start();
}
function applyBackend(){
 if(backendHealthy&&BACKEND_URL){DISABLED_EX.delete('KUCOIN');DISABLED_EX.delete('PHEMEX');}
 else{DISABLED_EX.add('KUCOIN');DISABLED_EX.add('PHEMEX');}
 recalcTotalEx();
 setNet(backendHealthy?'ok':(BACKEND_URL?'bad':'warn'),backendHealthy?'LINKED':(BACKEND_URL?'DOWN':'SOLO'));
 if(started){closeAll();setTimeout(launchAll,300);}
}

function ingest({exchange,price,qty,isBuy,ts}){
 tape.push({exchange,price,qty,isBuy,ts:ts||Date.now()});stamps.push(Date.now());
 if(tape.length>MAX_TAPE)tape.shift();
 prevPrice=lastPrice;lastPrice=price;vol+=qty;
 scheduleTape();updateStats();updatePrice();
}
function updatePrice(){
 const el=document.getElementById('price');
 el.textContent=lastPrice>0?lastPrice.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}):'--';
 if(prevPrice&&lastPrice!==prevPrice){el.classList.remove('up','dn');void el.offsetWidth;el.classList.add(lastPrice>prevPrice?'up':'dn');}
}
let tapeRaf=false;
function scheduleTape(){if(tapeRaf)return;tapeRaf=true;requestAnimationFrame(()=>{tapeRaf=false;
 const el=document.getElementById('tape');const f=document.createDocumentFragment();
 tape.forEach(t=>{const r=document.createElement('div');
  r.className=`tape-row ${t.isBuy?'tb':'ts'} ex-${t.exchange}`;
  const tm=new Date(t.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  r.innerHTML=`<span>${t.price.toFixed(2)}</span><span class="q">${t.qty.toFixed(4)}</span><span class="t">${tm}</span>`;f.appendChild(r);});
 el.innerHTML='';el.appendChild(f);
 document.getElementById('tape-count').textContent=tape.length;
});}
let bookRaf=false;
function scheduleBook(){if(bookRaf)return;bookRaf=true;requestAnimationFrame(()=>{bookRaf=false;
 const aEl=document.getElementById('dom-asks'),bEl=document.getElementById('dom-bids');
 const va=book.asks.slice(0,MAX_LEVELS),vb=book.bids.slice(0,MAX_LEVELS);
 const all=[...va.map(r=>+r[1]),...vb.map(r=>+r[1])];const mx=all.length?Math.max(...all):1;
 const rows=(lv,side)=>{const f=document.createDocumentFragment();
  lv.forEach(([p,q])=>{const P=+p,Q=+q;const pct=Math.min(100,(Q/mx)*100).toFixed(1);
   const d=document.createElement('div');d.className=`dom-row ${side==='ask'?'ask':'bid'}`;
   d.innerHTML=`<div class="dom-bar" style="width:${pct}%;background:${side==='ask'?'var(--red)':'var(--green)'}"></div><span class="dom-col">${P.toFixed(2)}</span><span class="dom-col">${Q.toFixed(4)}</span>`;
   f.appendChild(d);});return f;};
 aEl.innerHTML='';aEl.appendChild(rows(va,'ask'));bEl.innerHTML='';bEl.appendChild(rows(vb,'bid'));
 if(book.asks.length&&book.bids.length){const live=+book.asks[0][0]-+book.bids[0][0];
  document.getElementById('spread-live').textContent=fmtSpread(customSpread!=null?customSpread:live);}
});}
function updateStats(){const now=Date.now();stamps=stamps.filter(t=>now-t<TPS_WIN);
 document.getElementById('st-tps').textContent=(stamps.length/(TPS_WIN/1000)).toFixed(1);
 document.getElementById('st-vol').textContent=vol>=1000?(vol/1000).toFixed(1)+'K':vol.toFixed(2);}
function refreshStreams(){const n=Object.values(exStatus).filter(s=>s==='connected').length;
 document.getElementById('st-streams').textContent=`${n}/${TOTAL_EX}`;}
function setEx(id,s){exStatus[id]=s;refreshStreams();}

// ════════════════════════════════════════════════════════════════
// WS FACTORY
// ════════════════════════════════════════════════════════════════
const streamFactories={},retryDelay={},failCount={};
function makeWS(id,url,{onopen,onmessage,onping,pingMs}={}){
 return new Promise((res,rej)=>{let ws;try{ws=new WebSocket(url)}catch(e){return rej(e)}
  ws.binaryType='arraybuffer';sockets[id]=ws;let settled=false;
  ws.onopen=()=>{settled=true;failCount[id]=0;retryDelay[id]=1500;setEx(id,'connected');
   if(onopen)onopen(ws);if(onping&&pingMs)pings[id]=setInterval(()=>{if(ws.readyState===1)onping(ws)},pingMs);res(ws);};
  ws.onmessage=ev=>{try{onmessage(ev,ws)}catch{}};ws.onerror=()=>{};
  ws.onclose=()=>{if(ws._dead)return;clearInterval(pings[id]);setEx(id,'disconnected');
   if(!settled)return rej(new Error('closed'));scheduleReconnect(id,1500);};
 });}
async function gunzip(ab){const ds=new DecompressionStream('gzip');const w=ds.writable.getWriter();w.write(new Uint8Array(ab));w.close();
 const ch=[];const r=ds.readable.getReader();while(true){const{done,value}=await r.read();if(done)break;ch.push(value);}
 const t=ch.reduce((a,c)=>a+c.length,0);const o=new Uint8Array(t);let off=0;ch.forEach(c=>{o.set(c,off);off+=c.length});return new TextDecoder().decode(o);}
function closeAll(){Object.keys(sockets).forEach(id=>{const ws=sockets[id];if(ws){ws._dead=true;ws.onclose=null;ws.close()}delete sockets[id]});
 Object.keys(pings).forEach(id=>{clearInterval(pings[id]);delete pings[id]});
 Object.keys(failCount).forEach(id=>delete failCount[id]);Object.keys(retryDelay).forEach(id=>delete retryDelay[id]);
 EXCHANGES.forEach(e=>setEx(e,'disconnected'));}
function scheduleReconnect(id,delay=1500){const f=streamFactories[id];if(!f||DISABLED_EX.has(id))return;
 const next=Math.min(retryDelay[id]||delay,30000);retryDelay[id]=next*1.6;setTimeout(()=>openStream(id,f,next),next);}
function openStream(id,factory,retry=1500){streamFactories[id]=factory;retryDelay[id]=retry;
 const sym=SYM[currentBase]?.[id];if(!sym||DISABLED_EX.has(id)){setEx(id,'disconnected');return;}
 setEx(id,'connecting');
 factory(sym,id).then(()=>{failCount[id]=0;retryDelay[id]=1500;})
  .catch(err=>{failCount[id]=(failCount[id]||0)+1;dbg('WS',`${id} fail ${failCount[id]}: ${err?.message||err}`);
   if(failCount[id]>=6){setEx(id,'disconnected');return;}scheduleReconnect(id,retry);});}

 onping(ws){ws.send(JSON.stringify({jsonrpc:'2.0',id:99,method:'public/test',params:{}}))},pingMs:30000}),
};

function toggleAi(){aiOpen=!aiOpen;document.getElementById('ai').style.height=aiOpen?'230px':'31px';
 document.getElementById('ai-chev').textContent=aiOpen?'▼':'▲';
 ['ai-msgs','ai-inrow'].forEach(id=>document.getElementById(id).style.display=aiOpen?'':'none');}
function addMsg(r,t){const el=document.getElementById('ai-msgs');const d=document.createElement('div');
 d.className=r==='u'?'m-u':r==='t'?'m-t':r==='e'?'m-e':r==='s'?'m-s':'m-a';d.textContent=t;
 el.appendChild(d);el.scrollTop=el.scrollHeight;return d;}
function buildCtx(){const rec=tape.slice(-30);const buys=rec.filter(t=>t.isBuy).length;
 const avg=rec.length?(rec.reduce((a,t)=>a+t.price,0)/rec.length).toFixed(2):'N/A';
 const ba=book.asks[0]?+book.asks[0][0]:'N/A';const bb=book.bids[0]?+book.bids[0][0]:'N/A';
 const active=Object.entries(exStatus).filter(([,s])=>s==='connected').map(([id])=>id).join(',')||'none';
 return`[${currentBase} @ ${new Date().toISOString()}] Last:$${lastPrice?lastPrice.toFixed(2):'--'} Ask:$${ba} Bid:$${bb}\nLast30: ${buys} buys/${rec.length-buys} sells Avg:$${avg}\nFeeds:${active} Backend:${BACKEND_URL||'none'}(${backendHealthy?'ok':'down'})`;}
async function sendToGLM(){
 if(aiBusy)return;
 if(!BACKEND_URL){openBackendModal();addMsg('e','No backend. Configure one first.');return;}
 if(!nimKey){openKeyModal();return;}
 const inp=document.getElementById('ai-in');const btn=document.getElementById('ai-send');
 const msg=inp.value.trim();if(!msg)return;
 inp.value='';aiBusy=true;btn.disabled=true;document.getElementById('nim-dot').classList.add('busy');
 addMsg('u',msg);
 const messages=[{role:'system',content:`You are a professional crypto orderflow analyst in a live multi-exchange tape terminal. Be concise, use bullets.\n\n${buildCtx()}`},...aiHistory,{role:'user',content:msg}];
 aiHistory.push({role:'user',content:msg});
 const bubble=addMsg('a','');let full='',thinkB=null,think='';
 const url=`${BACKEND_URL.replace(/\/$/,'')}/api/nim/chat/completions`;
 dbg('NIM',`→ ${url}`);
 try{
  const resp=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${nimKey}`},
   body:JSON.stringify({model:NIM_MODEL,messages,temperature:0.6,top_p:0.9,max_tokens:1024,stream:true})});
  if(!resp.ok){let eb='';try{eb=await resp.text()}catch{}
   let m=`HTTP ${resp.status}`;try{const p=JSON.parse(eb);m+='\n'+(p?.message||p?.detail||eb.slice(0,200))}catch{m+='\n'+eb.slice(0,200)}
   if(resp.status===401)m+='\n→ Invalid nvapi- key.';if(resp.status===429)m+='\n→ Rate limit.';
   bubble.remove();aiHistory.pop();addMsg('e',m);return;}
  const reader=resp.body.getReader();const dec=new TextDecoder();let buf='';
  while(true){const{done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});
   const lines=buf.split('\n');buf=lines.pop();
   for(const line of lines){if(!line.startsWith('data:'))continue;const pl=line.slice(5).trim();if(pl==='[DONE]')break;
    try{const ch=JSON.parse(pl);const d=ch.choices?.[0]?.delta;if(!d)continue;
     if(d.reasoning_content){think+=d.reasoning_content;if(!thinkB)thinkB=addMsg('t','');thinkB.textContent='💭 '+think;document.getElementById('ai-msgs').scrollTop=1e4;}
     if(d.content){full+=d.content;bubble.textContent=full;document.getElementById('ai-msgs').scrollTop=1e4;}}catch{}}}
  aiHistory.push({role:'assistant',content:full});if(aiHistory.length>20)aiHistory.splice(0,2);
 }catch(err){bubble.remove();aiHistory.pop();addMsg('e',`Fetch failed: ${err.message}`);}
 finally{aiBusy=false;btn.disabled=false;document.getElementById('nim-dot').classList.remove('busy');}
}
