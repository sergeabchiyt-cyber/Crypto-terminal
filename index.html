<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OMNI STREAM</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#0b0e14;--bg1:#12161f;--bg2:#1a1f2c;--line:#242c3d;
  --txt:#dfe3ec;--dim:#78829a;--green:#17d2ad;--red:#f6465d;
  --amber:#f0b90b;--purple:#8b7cf6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'JetBrains Mono',monospace;color:var(--txt);background:var(--bg0);display:flex;flex-direction:column;height:100vh}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a3347;border-radius:2px}
.disp{font-family:'Chakra Petch',sans-serif}

/* ── settings (top, inline) ── */
#settings{flex-shrink:0;border-bottom:1px solid var(--line);padding:5px 7px;display:flex;flex-direction:column;gap:4px;background:linear-gradient(180deg,var(--bg1),var(--bg0))}
#settings .row{display:flex;align-items:center;gap:5px}
#settings .lbl{font-size:7px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;width:28px;flex-shrink:0}
#backend-url{flex:1;background:var(--bg0);border:1px solid var(--line);color:var(--txt);font-size:9px;font-family:'JetBrains Mono',monospace;padding:3px 6px;border-radius:4px;outline:none;min-width:0}
#backend-url:focus{border-color:var(--green)}
.sbtn{border:1px solid var(--line);background:var(--bg2);color:var(--dim);font-size:8px;font-weight:700;font-family:'Chakra Petch',sans-serif;padding:3px 7px;border-radius:4px;cursor:pointer;transition:.12s;flex-shrink:0}
.sbtn:hover{color:var(--txt);border-color:#3a4560}
.sbtn.go{background:var(--green);color:#06251d;border-color:var(--green)}
#backend-status{font-size:7.5px;color:var(--dim);min-height:10px;line-height:1.2}
.d{width:5px;height:5px;border-radius:50%;display:inline-block;flex-shrink:0}
.d.ok{background:var(--green);box-shadow:0 0 4px var(--green)}
.d.warn{background:var(--amber);box-shadow:0 0 4px var(--amber);animation:pulse 1s infinite}
.d.bad{background:var(--red);box-shadow:0 0 4px var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
select{background:var(--bg1);border:1px solid var(--line);color:var(--amber);border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;outline:none;padding:2px 4px;cursor:pointer}
#price{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:14px;line-height:1}
#price.up{color:var(--green)}
#price.dn{color:var(--red)}
.chk{display:flex;align-items:center;gap:4px;font-size:7.5px;color:var(--dim);cursor:pointer}
.chk input{accent-color:var(--purple);width:10px;height:10px}

/* ── orderflow (middle, fills) ── */
#orderflow{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative}
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:2px 6px;font-size:7px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;border-bottom:1px solid var(--line);flex-shrink:0;background:rgba(255,255,255,.015)}
.live-dot{width:3px;height:3px;border-radius:50%;background:var(--green);box-shadow:0 0 4px var(--green);animation:pulse 1.6s infinite;display:inline-block}

#dom-wrap{flex-shrink:0;display:flex;flex-direction:column;border-bottom:1px solid var(--line)}
.dom-row{position:relative;display:flex;justify-content:space-between;padding:0 6px;font-size:9px;line-height:1.55}
.dom-bar{position:absolute;top:0;bottom:0;right:0;opacity:.13;pointer-events:none}
.dom-col{position:relative;z-index:1}
.ask{color:var(--red)}.bid{color:var(--green)}
#spreadbar{display:flex;align-items:center;justify-content:center;gap:5px;padding:1px 4px;font-size:8px;font-weight:700;color:var(--amber);flex-shrink:0}
#spread-input{width:44px;text-align:center;font-size:8px;padding:1px 3px;color:var(--amber);background:var(--bg1);border:1px solid var(--line);border-radius:3px;outline:none}

#tape-wrap{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
#tape{flex:1;overflow:hidden;display:flex;flex-direction:column-reverse}
.tape-row{display:grid;grid-template-columns:1fr .65fr .75fr;font-size:9px;line-height:1.55;padding:0 6px 0 7px;border-left:2px solid transparent;border-bottom:1px solid rgba(36,44,61,.3)}
.tape-row .q{text-align:right}.tape-row .t{text-align:right;color:var(--dim);font-size:7.5px}
.tb{color:var(--green)}.ts{color:var(--red)}
.ex-BINANCE{border-color:#f0b90b}.ex-BINANCEFUT{border-color:#f3d06d}.ex-BYBIT{border-color:#ff6b35}.ex-BYBITLIN{border-color:#ff9a6c}
.ex-OKX{border-color:#60a5fa}.ex-OKXFUT{border-color:#93c5fd}.ex-GATE{border-color:#34d399}.ex-MEXC{border-color:#a78bfa}
.ex-BITGET{border-color:#fb923c}.ex-KUCOIN{border-color:#22d3ee}.ex-BITSTAMP{border-color:#84cc16}.ex-GEMINI{border-color:#e879f9}
.ex-KRAKEN{border-color:#7c3aed}.ex-COINBASE{border-color:#0ea5e9}.ex-BITFINEX{border-color:#f97316}.ex-HTX{border-color:#10b981}
.ex-PHEMEX{border-color:#d946ef}.ex-POLONIEX{border-color:#fcd34d}.ex-BINGX{border-color:#38bdf8}.ex-WOOX{border-color:#ec4899}.ex-DERIBIT{border-color:#c084fc}

#stats-row{display:flex;gap:4px;padding:3px 6px;border-top:1px solid var(--line);flex-shrink:0}
.stat{flex:1;background:var(--bg1);border:1px solid var(--line);border-radius:4px;padding:2px 5px}
.stat .l{font-size:6.5px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.stat .v{font-size:10px;font-weight:700}

/* ── AI (bottom, overlaps orderflow) ── */
#ai{position:absolute;bottom:0;left:0;right:0;z-index:50;background:var(--bg1);border-top:1px solid var(--purple);
  display:flex;flex-direction:column;transform:translateY(100%);transition:transform .2s ease;
  height:55%;max-height:320px;box-shadow:0 -8px 30px rgba(0,0,0,.5)}
#ai.open{transform:none}
#ai-head{display:flex;align-items:center;justify-content:space-between;padding:5px 8px;cursor:pointer;flex-shrink:0;border-bottom:1px solid var(--line)}
.ai-badge{display:flex;align-items:center;gap:5px;font-size:8.5px;font-weight:700;letter-spacing:.12em;color:var(--purple);text-transform:uppercase}
.nim-dot{width:5px;height:5px;border-radius:50%;background:#76b900;box-shadow:0 0 5px #76b900}
.nim-dot.busy{animation:pulse .6s infinite}
#ai-msgs{flex:1;overflow-y:auto;padding:6px 8px;display:flex;flex-direction:column;gap:4px;font-size:10px;line-height:1.45;min-height:0}
.m-u{align-self:flex-end;background:#1c3a5e;color:#bfdbfe;border-radius:7px 7px 2px 7px;padding:4px 7px;max-width:88%;white-space:pre-wrap;word-break:break-word}
.m-a{align-self:flex-start;background:var(--bg2);color:#cfd4e0;border-radius:7px 7px 7px 2px;padding:4px 7px;max-width:92%;white-space:pre-wrap;word-break:break-word;border-left:2px solid var(--purple)}
.m-t{align-self:flex-start;background:#10141f;color:var(--dim);border-radius:4px;padding:3px 6px;font-style:italic;font-size:8.5px;border-left:2px solid #374151;max-width:92%;white-space:pre-wrap}
.m-e{align-self:center;background:#3b0d0d;color:#fca5a5;border-radius:4px;padding:3px 7px;font-size:8.5px}
.m-s{align-self:center;color:var(--dim);font-size:8.5px;font-style:italic}
#ai-inrow{display:flex;gap:4px;padding:5px 7px;border-top:1px solid var(--line);flex-shrink:0}
#ai-in{flex:1;background:var(--bg0);border:1px solid var(--line);color:var(--txt);font-size:10px;font-family:'JetBrains Mono',monospace;padding:4px 7px;border-radius:5px;outline:none;resize:none;min-height:26px;max-height:52px}
#ai-in:focus{border-color:var(--purple)}
#ai-send{background:var(--purple);color:#fff;font-size:9px;font-weight:700;border:none;border-radius:5px;padding:0 10px;cursor:pointer;font-family:'Chakra Petch',sans-serif}
#ai-send:disabled{opacity:.4;cursor:not-allowed}

/* AI toggle tab (always visible at bottom) */
#ai-tab{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:5px;padding:3px 0;cursor:pointer;border-top:1px solid var(--line);background:var(--bg1);transition:.12s;font-size:8px;font-weight:700;letter-spacing:.14em;color:var(--purple);text-transform:uppercase;font-family:'Chakra Petch',sans-serif}
#ai-tab:hover{background:var(--bg2)}

/* key modal (only modal kept — for password input) */
.modal{position:fixed;inset:0;background:rgba(5,7,12,.85);backdrop-filter:blur(4px);z-index:70;display:flex;align-items:center;justify-content:center}
.modal.hidden{display:none}
.modal-box{background:var(--bg1);border:1px solid #333d55;border-radius:10px;padding:18px;width:340px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal input[type=password]{width:100%;background:var(--bg0);border:1px solid var(--line);color:var(--txt);font-size:11px;font-family:'JetBrains Mono',monospace;padding:7px 9px;border-radius:6px;outline:none;margin:8px 0}
.modal input:focus{border-color:var(--green)}
.mbtn{border:none;border-radius:6px;font-size:11px;font-weight:700;padding:7px 12px;cursor:pointer;font-family:'Chakra Petch',sans-serif}
.mbtn-p{background:var(--purple);color:#fff}
.mbtn-d{background:var(--bg2);color:var(--dim);border:1px solid var(--line)}

#debug{position:fixed;bottom:0;left:0;right:0;height:100px;background:#080a10;border-top:1px solid #333d55;z-index:80;font-size:8px;overflow-y:auto;padding:4px 8px;color:#9aa3b8;display:none}
#debug.open{display:block}
</style>
</head>
<body>

<!-- ═══ SETTINGS (inline, top) ═══ -->
<div id="settings">
  <div class="row">
    <span class="disp" style="font-weight:700;font-size:11px;letter-spacing:.1em;flex-shrink:0">OMNI<span style="color:var(--green)">·</span>S</span>
    <select id="asset" onchange="switchSymbol(this.value)">
      <option value="BTCUSDT">BTC</option><option value="ETHUSDT">ETH</option><option value="SOLUSDT">SOL</option><option value="BNBUSDT">BNB</option><option value="XRPUSDT">XRP</option>
    </select>
    <span id="price" class="up">--</span>
    <span style="flex:1"></span>
    <span class="d warn" id="net-dot"></span>
    <span id="net-txt" style="font-size:7.5px;color:var(--dim)">…</span>
  </div>
  <div class="row">
    <span class="lbl">URL</span>
    <input id="backend-url" type="url" placeholder="https://your-backend.example.com"/>
    <button class="sbtn" onclick="testBackend()">Test</button>
    <button class="sbtn go" onclick="connectBackend()">Go</button>
  </div>
  <div class="row">
    <span id="backend-status">Idle</span>
    <span style="flex:1"></span>
    <label class="chk"><input type="checkbox" id="allow-nobackend"/>limited</label>
    <button class="sbtn" onclick="openKeyModal()" title="NIM key">🔑</button>
    <button class="sbtn" onclick="toggleDebug()">▤</button>
  </div>
</div>

<!-- ═══ ORDERFLOW (middle) ═══ -->
<div id="orderflow">
  <div id="dom-wrap">
    <div class="sec-h"><span style="display:flex;align-items:center;gap:3px"><span class="live-dot"></span>Depth</span><span style="color:var(--amber)">BINANCE</span></div>
    <div id="dom-asks" style="display:flex;flex-direction:column-reverse;overflow:hidden"></div>
    <div id="spreadbar"><span>SPR</span><span id="spread-live">--</span><input id="spread-input" type="number" step="any" min="0" placeholder="auto" oninput="setCustomSpread(this.value)"/></div>
    <div id="dom-bids" style="display:flex;flex-direction:column;overflow:hidden"></div>
  </div>
  <div id="tape-wrap">
    <div class="sec-h"><span style="display:flex;align-items:center;gap:3px"><span class="live-dot"></span>Time &amp; Sales</span><span id="tape-count" style="color:var(--dim)">0</span></div>
    <div id="tape"></div>
  </div>
  <div id="stats-row">
    <div class="stat"><div class="l">Streams</div><div class="v" id="st-streams" style="color:var(--green)">0/0</div></div>
    <div class="stat"><div class="l">Trades/s</div><div class="v" id="st-tps" style="color:var(--amber)">0</div></div>
    <div class="stat"><div class="l">Vol</div><div class="v" id="st-vol" style="color:#60a5fa">--</div></div>
  </div>

  <!-- AI (overlaps orderflow from bottom) -->
  <div id="ai">
    <div id="ai-head" onclick="toggleAi()">
      <span class="ai-badge"><span class="nim-dot" id="nim-dot"></span>NIM · GLM-5.2</span>
      <span style="color:var(--dim);font-size:9px">▼</span>
    </div>
    <div id="ai-msgs"></div>
    <div id="ai-inrow">
      <textarea id="ai-in" rows="1" placeholder="Ask…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendToGLM()}"></textarea>
      <button id="ai-send" onclick="sendToGLM()">→</button>
    </div>
  </div>
</div>

<!-- AI toggle tab -->
<div id="ai-tab" onclick="toggleAi()"><span class="nim-dot" style="width:4px;height:4px"></span>AI</div>

<!-- ═══ KEY MODAL (password only) ═══ -->
<div id="key-modal" class="modal hidden">
  <div class="modal-box">
    <div class="disp" style="font-weight:700;font-size:12px">NIM <span style="color:var(--purple)">GLM-5.2</span> Key</div>
    <input id="nim-key" type="password" placeholder="nvapi-…"/>
    <p id="key-err" style="font-size:9px;min-height:11px;margin-bottom:6px"></p>
    <div style="display:flex;gap:7px">
      <button class="mbtn mbtn-d" onclick="closeKeyModal()">Skip</button>
      <button class="mbtn mbtn-p" style="flex:1" onclick="saveNimKey()">Save</button>
    </div>
  </div>
</div>

<div id="debug"><div id="debug-log"></div></div>

<script>
const SHARED_SECRET_HEX="0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef";
const MAX_TAPE=80,MAX_LEVELS=8,TPS_WIN=2000,NIM_MODEL='z-ai/glm-5.2';
let TOTAL_EX=21,currentBase='BTCUSDT';
let tape=[],stamps=[],lastPrice=0,prevPrice=0,vol=0;
const sockets={},pings={};
const book={asks:[],bids:[]};
let customSpread=null,nimKey=sessionStorage.getItem('nim_key')||'';
let aiHistory=[],aiBusy=false;
let BACKEND_URL=loadBackendUrl(),backendHealthy=false,started=false;

const EXCHANGES=['BINANCE','BINANCEFUT','BYBIT','BYBITLIN','OKX','OKXFUT','GATE','MEXC','BITGET','KUCOIN','BITSTAMP','GEMINI','KRAKEN','COINBASE','BITFINEX','HTX','PHEMEX','POLONIEX','BINGX','WOOX','DERIBIT'];
const exStatus={};EXCHANGES.forEach(e=>exStatus[e]='disconnected');
const DISABLED_EX=new Set(['KUCOIN','PHEMEX']);
function recalcTotalEx(){TOTAL_EX=EXCHANGES.filter(e=>!DISABLED_EX.has(e)).length;refreshStreams();}

const SYM={
 BTCUSDT:{BINANCE:'btcusdt',BINANCEFUT:'btcusdt',BYBIT:'BTCUSDT',BYBITLIN:'BTCUSDT',OKX:'BTC-USDT',OKXFUT:'BTC-USDT-SWAP',GATE:'BTC_USDT',MEXC:'BTCUSDT',BITGET:'BTCUSDT',KUCOIN:'BTC-USDT',BITSTAMP:'btcusdt',GEMINI:'BTCUSD',KRAKEN:'BTC/USDT',COINBASE:'BTC-USDT',BITFINEX:'tBTCUSD',HTX:'btcusdt',PHEMEX:'BTCUSDT',POLONIEX:'BTC_USDT',BINGX:'BTC-USDT',WOOX:'SPOT_BTC_USDT',DERIBIT:'BTC_USDT'},
 ETHUSDT:{BINANCE:'ethusdt',BINANCEFUT:'ethusdt',BYBIT:'ETHUSDT',BYBITLIN:'ETHUSDT',OKX:'ETH-USDT',OKXFUT:'ETH-USDT-SWAP',GATE:'ETH_USDT',MEXC:'ETHUSDT',BITGET:'ETHUSDT',KUCOIN:'ETH-USDT',BITSTAMP:'ethusdt',GEMINI:'ETHUSD',KRAKEN:'ETH/USDT',COINBASE:'ETH-USDT',BITFINEX:'tETHUSD',HTX:'ethusdt',PHEMEX:'ETHUSDT',POLONIEX:'ETH_USDT',BINGX:'ETH-USDT',WOOX:'SPOT_ETH_USDT',DERIBIT:'ETH_USDT'},
 SOLUSDT:{BINANCE:'solusdt',BINANCEFUT:'solusdt',BYBIT:'SOLUSDT',BYBITLIN:'SOLUSDT',OKX:'SOL-USDT',OKXFUT:'SOL-USDT-SWAP',GATE:'SOL_USDT',MEXC:'SOLUSDT',BITGET:'SOLUSDT',KUCOIN:'SOL-USDT',BITSTAMP:'solusd',GEMINI:'SOLUSD',KRAKEN:'SOL/USDT',COINBASE:'SOL-USDT',BITFINEX:'tSOLUSD',HTX:'solusdt',PHEMEX:'SOLUSDT',POLONIEX:'SOL_USDT',BINGX:'SOL-USDT',WOOX:'SPOT_SOL_USDT',DERIBIT:null},
 BNBUSDT:{BINANCE:'bnbusdt',BINANCEFUT:'bnbusdt',BYBIT:'BNBUSDT',BYBITLIN:'BNBUSDT',OKX:'BNB-USDT',OKXFUT:null,GATE:'BNB_USDT',MEXC:'BNBUSDT',BITGET:'BNBUSDT',KUCOIN:'BNB-USDT',BITSTAMP:null,GEMINI:null,KRAKEN:null,COINBASE:null,BITFINEX:null,HTX:'bnbusdt',PHEMEX:'BNBUSDT',POLONIEX:'BNB_USDT',BINGX:'BNB-USDT',WOOX:'SPOT_BNB_USDT',DERIBIT:null},
 XRPUSDT:{BINANCE:'xrpusdt',BINANCEFUT:'xrpusdt',BYBIT:'XRPUSDT',BYBITLIN:'XRPUSDT',OKX:'XRP-USDT',OKXFUT:'XRP-USDT-SWAP',GATE:'XRP_USDT',MEXC:'XRPUSDT',BITGET:'XRPUSDT',KUCOIN:'XRP-USDT',BITSTAMP:'xrpusdt',GEMINI:'XRPUSD',KRAKEN:'XRP/USDT',COINBASE:'XRP-USDT',BITFINEX:'tXRPUSD',HTX:'xrpusdt',PHEMEX:'XRPUSDT',POLONIEX:'XRP_USDT',BINGX:'XRP-USDT',WOOX:'SPOT_XRP_USDT',DERIBIT:null},
};

function loadBackendUrl(){try{return localStorage.getItem('backend_url')||''}catch{return''}}
function saveBackendUrl(u){try{u?localStorage.setItem('backend_url',u):localStorage.removeItem('backend_url')}catch{}}
function normalizeBackendUrl(r){let u=(r||'').trim();if(!u)return'';if(!/^https?:\/\//i.test(u))u='https://'+u;try{return new URL(u).origin}catch{return''}}
function wsBase(r){try{const u=new URL(r);return(u.protocol==='https:'?'wss://':'ws://')+u.host}catch{return''}}
function dbg(l,...a){const m=a.map(x=>typeof x==='object'?JSON.stringify(x):String(x)).join(' ');console.log(`[${l}]`,m);
 const el=document.getElementById('debug-log');if(!el)return;const d=document.createElement('div');
 d.innerHTML=`<span style="color:#5b6478">${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</span> <span style="color:#8b7cf6">[${l}]</span> ${m}`;
 el.insertBefore(d,el.firstChild);if(el.children.length>50)el.lastChild.remove();}
function toggleDebug(){document.getElementById('debug').classList.toggle('open')}

async function encryptAES(text,hexKey){
 const enc=new TextEncoder();const kb=new Uint8Array(hexKey.match(/.{1,2}/g).map(b=>parseInt(b,16)));
 const ck=await crypto.subtle.importKey("raw",kb,{name:"AES-GCM"},false,["encrypt"]);
 const iv=crypto.getRandomValues(new Uint8Array(12));
 const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},ck,enc.encode(text));
 return{iv:btoa(String.fromCharCode(...iv)),ciphertext:btoa(String.fromCharCode(...new Uint8Array(ct)))};
}

function setNet(s,t){document.getElementById('net-dot').className='d '+(s==='ok'?'ok':s==='bad'?'bad':'warn');document.getElementById('net-txt').textContent=t;}
async function checkBackend(url){try{const c=new AbortController();const t=setTimeout(()=>c.abort(),4000);
 const r=await fetch(`${url}/healthz`,{cache:'no-store',signal:c.signal});clearTimeout(t);
 if(!r.ok)throw 0;const j=await r.json();return j?.ok===true;}catch{return false;}}
async function testBackend(){const url=normalizeBackendUrl(document.getElementById('backend-url').value);const s=document.getElementById('backend-status');
 if(!url){s.textContent='✗ Invalid URL';s.style.color='var(--red)';return;}
 s.textContent='⏳ checking…';s.style.color='var(--amber)';
 const ok=await checkBackend(url);s.textContent=ok?'✓ healthy':'✗ unreachable';s.style.color=ok?'var(--green)':'var(--red)';}
async function connectBackend(){
 const raw=document.getElementById('backend-url').value;const allow=document.getElementById('allow-nobackend').checked;
 const url=normalizeBackendUrl(raw);const s=document.getElementById('backend-status');
 if(!url){if(allow){BACKEND_URL='';backendHealthy=false;saveBackendUrl('');applyBackend();start();return;}
  s.textContent='✗ URL or check limited';s.style.color='var(--red)';return;}
 s.textContent='⏳';s.style.color='var(--amber)';
 const ok=await checkBackend(url);backendHealthy=ok;BACKEND_URL=url;saveBackendUrl(url);
 if(!ok&&!allow){s.textContent='✗ unreachable — enable limited';s.style.color='var(--red)';return;}
 s.textContent=ok?'✓ linked':'⚠ limited';s.style.color=ok?'var(--green)':'var(--amber)';
 applyBackend();start();}
function applyBackend(){
 if(backendHealthy&&BACKEND_URL){DISABLED_EX.delete('KUCOIN');DISABLED_EX.delete('PHEMEX');}
 else{DISABLED_EX.add('KUCOIN');DISABLED_EX.add('PHEMEX');}
 recalcTotalEx();setNet(backendHealthy?'ok':(BACKEND_URL?'bad':'warn'),backendHealthy?'OK':(BACKEND_URL?'DOWN':'SOLO'));
 if(started){closeAll();setTimeout(launchAll,300);}}

function openKeyModal(){document.getElementById('key-modal').classList.remove('hidden');document.getElementById('nim-key').value=nimKey||'';document.getElementById('key-err').textContent='';}
function closeKeyModal(){document.getElementById('key-modal').classList.add('hidden');}
async function saveNimKey(){
 const v=document.getElementById('nim-key').value.trim();const e=document.getElementById('key-err');
 if(!v.startsWith('nvapi-')){e.textContent='✗ must start nvapi-';e.style.color='var(--red)';return;}
 if(BACKEND_URL&&backendHealthy){try{const enc=await encryptAES(v,SHARED_SECRET_HEX);
   await fetch(`${BACKEND_URL}/api/config/keys`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(enc)});}catch{}}
 nimKey=v;sessionStorage.setItem('nim_key',v);closeKeyModal();addMsg('s','✓ key saved');}

function setCustomSpread(v){const n=parseFloat(v);customSpread=(v===''||isNaN(n))?null:n;scheduleBook();}
function fmtSpread(n){return'$'+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:4});}

function ingest({exchange,price,qty,isBuy,ts}){
 tape.push({exchange,price,qty,isBuy,ts:ts||Date.now()});stamps.push(Date.now());
 if(tape.length>MAX_TAPE)tape.shift();
 prevPrice=lastPrice;lastPrice=price;vol+=qty;
 scheduleTape();updateStats();updatePrice();}
function updatePrice(){const el=document.getElementById('price');
 el.textContent=lastPrice>0?lastPrice.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}):'--';
 if(prevPrice&&lastPrice!==prevPrice){el.classList.remove('up','dn');void el.offsetWidth;el.classList.add(lastPrice>prevPrice?'up':'dn');}}
let tapeRaf=false;
function scheduleTape(){if(tapeRaf)return;tapeRaf=true;requestAnimationFrame(()=>{tapeRaf=false;
 const el=document.getElementById('tape');const f=document.createDocumentFragment();
 tape.forEach(t=>{const r=document.createElement('div');r.className=`tape-row ${t.isBuy?'tb':'ts'} ex-${t.exchange}`;
  r.innerHTML=`<span>${t.price.toFixed(2)}</span><span class="q">${t.qty.toFixed(4)}</span><span class="t">${new Date(t.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</span>`;f.appendChild(r);});
 el.innerHTML='';el.appendChild(f);document.getElementById('tape-count').textContent=tape.length;});}
let bookRaf=false;
function scheduleBook(){if(bookRaf)return;bookRaf=true;requestAnimationFrame(()=>{bookRaf=false;

 const va=book.asks.slice(0,MAX_LEVELS),vb=book.bids.slice(0,MAX_LEVELS);
 const all=[...va.map(r=>+r[1]),...vb.map(r=>+r[1])];const mx=all.length?Math.max(...all):1;
 const rows=(lv,side)=>{const f=document.createDocumentFragment();
  lv.forEach(([p,q])=>{const P=+p,Q=+q;const pct=Math.min(100,(Q/mx)*100).toFixed(1);
   const d=document.createElement('div');d.className=`dom-row ${side==='ask'?'ask':'bid'}`;

  document.getElementById('spread-live').textContent=fmtSpread(customSpread!=null?customSpread:live);}});}
function updateStats(){const now=Date.now();stamps=stamps.filter(t=>now-t<TPS_WIN);
 document.getElementById('st-tps').textContent=(stamps.length/(TPS_WIN/1000)).toFixed(1);
 document.getElementById('st-vol').textContent=vol>=1000?(vol/1000).toFixed(1)+'K':vol.toFixed(1);}
function refreshStreams(){const n=Object.values(exStatus).filter(s=>s==='connected').length;
 document.getElementById('st-streams').textContent=`${n}/${TOTAL_EX}`;}
function setEx(id,s){exStatus[id]=s;refreshStreams();}

const streamFactories={},retryDelay={},failCount={};
function makeWS(id,url,{onopen,onmessage,onping,pingMs}={}){
 return new Promise((res,rej)=>{let ws;try{ws=new WebSocket(url)}catch(e){return rej(e)}
  ws.binaryType='arraybuffer';sockets[id]=ws;let settled=false;
  ws.onopen=()=>{settled=true;failCount[id]=0;retryDelay[id]=1500;setEx(id,'connected');
   if(onopen)onopen(ws);if(onping&&pingMs)pings[id]=setInterval(()=>{if(ws.readyState===1)onping(ws)},pingMs);res(ws);};
  ws.onmessage=ev=>{try{onmessage(ev,ws)}catch{}};ws.onerror=()=>{};
  ws.onclose=()=>{if(ws._dead)return;clearInterval(pings[id]);setEx(id,'disconnected');
   if(!settled)return rej(new Error('closed'));scheduleReconnect(id,1500);};});}
async function gunzip(ab){const ds=new DecompressionStream('gzip');const w=ds.writable.getWriter();w.write(new Uint8Array(ab));w.close();
 const ch=[];const r=ds.readable.getReader();while(true){const{done,value}=await r.read();if(done)break;ch.push(value);}
 const t=ch.reduce((a,c)=>a+c.length,0);const o=new Uint8Array(t);let off=0;ch.forEach(c=>{o.set(c,off);off+=c.length});return new TextDecoder().decode(o);}
function closeAll(){Object.keys(sockets).forEach(id=>{const ws=sockets[id];if(ws){ws._dead=true;ws.onclose=null;ws.close()}delete sockets[id]});
 Object.keys(pings).forEach(id=>{clearInterval(pings[id]);delete pings[id]});
 EXCHANGES.forEach(e=>setEx(e,'disconnected'));}
function scheduleReconnect(id,delay=1500){const f=streamFactories[id];if(!f||DISABLED_EX.has(id))return;
 const next=Math.min(retryDelay[id]||delay,30000);retryDelay[id]=next*1.6;setTimeout(()=>openStream(id,f,next),next);}
function openStream(id,factory,retry=1500){streamFactories[id]=factory;retryDelay[id]=retry;
 const sym=SYM[currentBase]?.[id];if(!sym||DISABLED_EX.has(id)){setEx(id,'disconnected');return;}
 setEx(id,'connecting');
 factory(sym,id).then(()=>{failCount[id]=0;retryDelay[id]=1500;})
  .catch(err=>{failCount[id]=(failCount[id]||0)+1;
   if(failCount[id]>=6){setEx(id,'disconnected');return;}scheduleReconnect(id,retry);});}

function addMsg(r,t){const el=document.getElementById('ai-msgs');const d=document.createElement('div');
 d.className=r==='u'?'m-u':r==='t'?'m-t':r==='e'?'m-e':r==='s'?'m-s':'m-a';d.textContent=t;
 el.appendChild(d);el.scrollTop=el.scrollHeight;return d;}
function buildCtx(){const rec=tape.slice(-30);const buys=rec.filter(t=>t.isBuy).length;
 const avg=rec.length?(rec.reduce((a,t)=>a+t.price,0)/rec.length).toFixed(2):'N/A';
 const ba=book.asks[0]?+book.asks[0][0]:'N/A';const bb=book.bids[0]?+book.bids[0][0]:'N/A';
 const active=Object.entries(exStatus).filter(([,s])=>s==='connected').map(([id])=>id).join(',')||'none';
 return`[${currentBase}] Last:$${lastPrice?lastPrice.toFixed(2):'--'} Ask:$${ba} Bid:$${bb} 30t:${buys}B/${rec.length-buys}S avg:$${avg} feeds:${active}`;}
async function sendToGLM(){
 if(aiBusy)return;
 if(!BACKEND_URL){addMsg('e','No backend — set URL above.');return;}
 if(!nimKey){openKeyModal();return;}
 const inp=document.getElementById('ai-in');const btn=document.getElementById('ai-send');
 const msg=inp.value.trim();if(!msg)return;
 inp.value='';aiBusy=true;btn.disabled=true;document.getElementById('nim-dot').classList.add('busy');
 addMsg('u',msg);
 const messages=[{role:'system',content:`Crypto orderflow analyst. Concise.\n${buildCtx()}`},...aiHistory,{role:'user',content:msg}];
 aiHistory.push({role:'user',content:msg});
 const bubble=addMsg('a','');let full='',thinkB=null,think='';
 try{
  const resp=await fetch(`${BACKEND_URL}/api/nim/chat/completions`,{method:'POST',
   headers:{'Content-Type':'application/json','Authorization':`Bearer ${nimKey}`},
   body:JSON.stringify({model:NIM_MODEL,messages,temperature:0.6,top_p:0.9,max_tokens:1024,stream:true})});
  if(!resp.ok){let m=`HTTP ${resp.status}`;if(resp.status===401)m+=' bad key';if(resp.status===429)m+=' rate limit';
   bubble.remove();aiHistory.pop();addMsg('e',m);return;}
  const reader=resp.body.getReader();const dec=new TextDecoder();let buf='';
  while(true){const{done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});
   const lines=buf.split('\n');buf=lines.pop();
   for(const line of lines){if(!line.startsWith('data:'))continue;const pl=line.slice(5).trim();if(pl==='[DONE]')break;
    try{const ch=JSON.parse(pl);const d=ch.choices?.[0]?.delta;if(!d)continue;
     if(d.reasoning_content){think+=d.reasoning_content;if(!thinkB)thinkB=addMsg('t','');thinkB.textContent='💭'+think;}
     if(d.content){full+=d.content;bubble.textContent=full;}}catch{}}}
  aiHistory.push({role:'assistant',content:full});if(aiHistory.length>16)aiHistory.splice(0,2);
 }catch(err){bubble.remove();aiHistory.pop();addMsg('e',err.message);}
 finally{aiBusy=false;btn.disabled=false;document.getElementById('nim-dot').classList.remove('busy');}
}

 else addMsg('s','Set NIM key (🔑) for AI.');}
